[pytest]
testpaths = api ui
python_files = test_*.py
addopts =
    --strict-markers
    --tb=short
    --junitxml=qa/artifacts/junit.xml
    --html=qa/artifacts/report.html
    --self-contained-html
    --alluredir=qa/artifacts/allure-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
markers =
    django_db: Tests that exercise the Django database.
    api: HTTP contract tests implemented with requests
    ui: Browser smoke tests implemented with Playwright
    e2e: Stateful registration, login, and protected-feature journeys
    smoke: Read-only critical checks for fast feedback
    ai_eval: Offline quality checks for generated test-case output
