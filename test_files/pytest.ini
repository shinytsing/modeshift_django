# pytest配置文件
[tool:pytest]
# 测试发现
testpaths = test_files
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    --verbose
    --tb=short
    --color=yes
    --strict-markers
    --disable-warnings
    --durations=10

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    api: API测试
    security: 安全测试
    performance: 性能测试
    slow: 慢速测试
    skip: 跳过测试

# 最小版本要求
minversion = 6.0

# 测试目录
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    __pycache__
    .pytest_cache

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = .
omit = 
    */venv/*
    */env/*
    */tests/*
    */test_files/*
    */migrations/*
    */__pycache__/*
    */node_modules/*
    */static/*
    */media/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
