{% extends 'base.html' %}
{% load static %}

{% block title %}🚀 后台任务管理器{% endblock %}

{% block extra_css %}
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* 极客风格配色 */
            --primary-color: #00ff88;
            --primary-dark: #00cc6a;
            --secondary-color: #00d4ff;
            --accent-color: #ff6b35;
            --warning-color: #ffd700;
            --error-color: #ff4757;
            --success-color: #2ed573;
            --info-color: #3742fa;

            /* 深色主题 */
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #666666;
            --border-color: #333333;
            --border-glow: rgba(0, 255, 136, 0.3);

            /* 动画效果 */
            --glow-shadow: 0 0 20px var(--border-glow);
            --glow-shadow-strong: 0 0 30px var(--primary-color);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景动画效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 107, 53, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundShift 20s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--glow-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        #app::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 0 20px var(--primary-color);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        h1::after {
            content: '⚡';
            position: absolute;
            right: -40px;
            top: 0;
            font-size: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1.1rem;
            font-style: italic;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--glow-shadow);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .task-list {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .task-header {
            background: var(--bg-secondary);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--bg-primary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-shadow);
        }

        .task-item {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: rgba(0, 255, 136, 0.05);
        }

        .task-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .task-id {
            font-family: monospace;
            color: var(--secondary-color);
            font-size: 0.9rem;
            background: rgba(0, 212, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 215, 0, 0.2);
            color: var(--warning-color);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .status-running {
            background: rgba(55, 66, 250, 0.2);
            color: var(--info-color);
            border: 1px solid rgba(55, 66, 250, 0.3);
        }

        .status-completed {
            background: rgba(46, 213, 115, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-failed {
            background: rgba(255, 71, 87, 0.2);
            color: var(--error-color);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .task-requirement {
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .task-progress {
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .action-btn:hover {
            background: var(--primary-color);
            color: var(--bg-primary);
        }

        /* 下载下拉菜单样式 */
        .download-dropdown {
            position: relative;
            display: inline-block;
        }

        .download-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .download-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .download-option {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            text-align: left;
        }

        .download-option:hover {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary-color);
        }

        .download-option:first-child {
            border-radius: 8px 8px 0 0;
        }

        .download-option:last-child {
            border-radius: 0 0 8px 8px;
        }

        .download-option i {
            width: 16px;
            text-align: center;
        }

        .delete-btn:hover {
            background: var(--error-color) !important;
            color: var(--bg-primary) !important;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 136, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            #app {
                margin: 10px;
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .task-item-header {
                flex-direction: column;
                gap: 10px;
            }

            .task-meta {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }

        /* 通知样式 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            color: var(--text-primary);
            box-shadow: var(--glow-shadow);
            z-index: 10000;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 350px;
            word-wrap: break-word;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-content i {
            font-size: 18px;
        }

        .notification-success {
            border-color: var(--success-color);
            background: rgba(46, 213, 115, 0.1);
        }

        .notification-success .notification-content i {
            color: var(--success-color);
        }

        .notification-error {
            border-color: var(--error-color);
            background: rgba(255, 71, 87, 0.1);
        }

        .notification-error .notification-content i {
            color: var(--error-color);
        }

        .notification-warning {
            border-color: var(--warning-color);
            background: rgba(255, 215, 0, 0.1);
        }

        .notification-warning .notification-content i {
            color: var(--warning-color);
        }

        .notification-info {
            border-color: var(--info-color);
            background: rgba(55, 66, 250, 0.1);
        }

        .notification-info .notification-content i {
            color: var(--info-color);
        }
    </style>
{% endblock %}
{% block content %}
<div id="app">
        <h1>后台任务管理器</h1>
        <p class="subtitle">🚀 查看所有后台任务的运行状态和结果</p>

        <!-- 快速导航 -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/tools/test_case_generator/" class="btn-outline" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); border-radius: 8px; text-decoration: none; transition: var(--transition);">
                <i class="fas fa-arrow-left"></i>
                返回测试用例生成器
            </a>
        </div>

        <!-- 统计信息 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">总任务数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="runningTasks">0</div>
                <div class="stat-label">运行中</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">已完成</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failedTasks">0</div>
                <div class="stat-label">失败</div>
            </div>
        </div>

        <!-- 任务列表 -->
        <div class="task-list">
            <div class="task-header">
                <div class="task-title">
                    <i class="fas fa-tasks"></i> 任务列表
                </div>
                <button class="refresh-btn" onclick="loadTasks()">
                    <i class="fas fa-refresh"></i> 刷新
                </button>
            </div>
            <div id="taskListContent">
                <div class="loading">
                    <div class="spinner"></div>
                    加载任务中...
                </div>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取任务列表
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            
            // 检查URL参数中是否有task_id，如果有则自动滚动到该任务
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('task_id');
            if (taskId) {
                // 延迟执行，确保任务列表已加载
                setTimeout(() => {
                    scrollToTask(taskId);
                }, 1000);
            }
            
            // 每30秒自动刷新一次
            setInterval(loadTasks, 30000);
            // 每10秒更新一次剩余时间显示
            setInterval(updateRemainingTimes, 10000);

            // 点击外部关闭下载菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.download-dropdown')) {
                    document.querySelectorAll('.download-menu').forEach(menu => {
                        menu.classList.remove('show');
                    });
                }
            });
        });

        function loadTasks() {
            const content = document.getElementById('taskListContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>加载任务中...</div>';

            axios.get('/tools/api/async/tasks/')
            .then(response => {
                if (response.data.success) {
                    const tasks = response.data.tasks || [];
                    updateStats(tasks);
                    renderTasks(tasks);
                    
                    // 如果URL中有task_id参数，滚动到该任务
                    const urlParams = new URLSearchParams(window.location.search);
                    const taskId = urlParams.get('task_id');
                    if (taskId) {
                        setTimeout(() => {
                            scrollToTask(taskId);
                        }, 500);
                    }
                } else {
                    content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>加载任务失败</p></div>';
                }
            })
            .catch(error => {
                console.error('加载任务失败:', error);
                content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>加载任务失败，请稍后重试</p></div>';
            });
        }

        function scrollToTask(taskId) {
            // 查找包含指定task_id的任务元素
            const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
            if (taskElement) {
                // 滚动到该任务元素
                taskElement.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
                
                // 高亮显示该任务
                taskElement.style.border = '2px solid var(--primary-color)';
                taskElement.style.boxShadow = '0 0 20px var(--primary-color)';
                
                // 3秒后移除高亮
                setTimeout(() => {
                    taskElement.style.border = '';
                    taskElement.style.boxShadow = '';
                }, 3000);
                
                // 显示通知
                showNotification(`已跳转到任务 ${taskId.substring(0, 8)}...`, 'success');
            } else {
                console.log(`未找到任务 ${taskId}`);
            }
        }

        function updateStats(tasks) {
            const total = tasks.length;
            const running = tasks.filter(t => t.status === 'running').length;
            const completed = tasks.filter(t => t.status === 'completed').length;
            const failed = tasks.filter(t => t.status === 'failed').length;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('runningTasks').textContent = running;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('failedTasks').textContent = failed;
        }

        function renderTasks(tasks) {
            const content = document.getElementById('taskListContent');

            // 检查任务状态变化并发送通知
            checkTaskStatusChanges(tasks);

            if (tasks.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>暂无后台任务</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">创建测试用例生成任务后，它们会显示在这里</p>
                    </div>
                `;
                return;
            }

            const html = tasks.map(task => {
                const statusClass = `status-${task.status}`;
                const statusText = {
                    'pending': '等待中',
                    'running': '运行中',
                    'completed': '已完成',
                    'failed': '失败'
                }[task.status] || task.status;

                const progress = task.progress || 0;
                const createdTime = new Date(task.created_at).toLocaleString();
                const completedTime = task.completed_at ? new Date(task.completed_at).toLocaleString() : '';

                return `
                    <div class="task-item" data-task-id="${task.id}">
                        <div class="task-item-header">
                            <div class="task-id">${task.id.substring(0, 8)}...</div>
                            <div class="task-status ${statusClass}">
                                <i class="fas fa-circle"></i>
                                ${statusText}
                            </div>
                        </div>

                        <div class="task-requirement">
                            ${task.requirement.substring(0, 100)}${task.requirement.length > 100 ? '...' : ''}
                        </div>

                        ${task.status === 'running' || task.status === 'pending' ? `
                            <div class="task-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress}%"></div>
                                </div>
                                <div class="progress-text">
                                    <span>${task.current_step || '处理中'}</span>
                                    <span>${progress}%</span>
                                </div>
                            </div>
                        ` : ''}

                        <div class="task-meta">
                            <div>
                                <i class="fas fa-clock"></i> 创建时间: ${createdTime}
                                ${completedTime ? `<br><i class="fas fa-check"></i> 完成时间: ${completedTime}` : ''}
                                ${task.status === 'pending' || task.status === 'running' ? `
                                    <br><i class="fas fa-hourglass-half"></i>
                                    <span style="color: ${isTaskNearTimeout(task.created_at) ? 'var(--warning-color)' : 'var(--text-muted)'}">
                                        剩余时间: ${getRemainingTime(task.created_at)}
                                    </span>
                                ` : ''}
                            </div>
                            <div class="task-actions">
                                ${task.status === 'completed' ? `
                                    <button class="action-btn" onclick="viewResult('${task.id}')">
                                        <i class="fas fa-eye"></i> 查看结果
                                    </button>
                                    <div class="download-dropdown">
                                        <button class="action-btn download-btn" onclick="toggleDownloadMenu('${task.id}')" style="color: var(--success-color); border-color: var(--success-color);">
                                            <i class="fas fa-download"></i> 下载 <i class="fas fa-chevron-down"></i>
                                        </button>
                                        <div class="download-menu" id="downloadMenu_${task.id}">
                                            <button class="download-option" onclick="downloadResult('${task.id}', 'txt')">
                                                <i class="fas fa-file-alt"></i> TXT格式
                                            </button>
                                            <button class="download-option" onclick="downloadResult('${task.id}', 'xmind')">
                                                <i class="fas fa-sitemap"></i> XMind格式
                                            </button>
                                            <button class="download-option" onclick="downloadResult('${task.id}', 'feishu')">
                                                <i class="fas fa-file-code"></i> 飞书格式
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}
                                ${task.status === 'failed' ? `
                                    <button class="action-btn" onclick="viewError('${task.id}')">
                                        <i class="fas fa-exclamation-triangle"></i> 查看错误
                                    </button>
                                ` : ''}
                                <button class="action-btn delete-btn" onclick="deleteTask('${task.id}')" style="color: var(--error-color); border-color: var(--error-color);">
                                    <i class="fas fa-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            content.innerHTML = html;
        }

        function viewResult(taskId) {
            // 获取任务详情并显示结果
            axios.get(`/tools/api/async/task/${taskId}/`)
            .then(response => {
                if (response.data.success && response.data.result) {
                    // 在新窗口中显示结果
                    const resultWindow = window.open('', '_blank', 'width=800,height=600');
                    resultWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>任务结果 - ${taskId.substring(0, 8)}</title>
                            <style>
                                body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
                                pre { white-space: pre-wrap; word-wrap: break-word; }
                                .actions { margin: 20px 0; }
                                .btn { padding: 10px 20px; margin: 5px; background: #00ff88; color: #000; border: none; cursor: pointer; border-radius: 5px; }
                                .btn:hover { background: #00cc6a; }
                            </style>
                        </head>
                        <body>
                            <h2>任务结果</h2>
                            <div class="actions">
                                <button class="btn" onclick="downloadResultLocal()">下载结果</button>
                                <button class="btn" onclick="copyResult()">复制内容</button>
                            </div>
                            <pre id="resultContent">${response.data.result}</pre>
                            <script>
                                function downloadResultLocal() {
                                    const content = document.getElementById('resultContent').textContent;
                                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = '任务结果_' + taskId.substring(0, 8) + '_' + new Date().toISOString().slice(0, 10) + '.txt';
                                    document.body.appendChild(a);
                                    a.click();
                                    document.body.removeChild(a);
                                    URL.revokeObjectURL(url);
                                }
                                function copyResult() {
                                    const content = document.getElementById('resultContent').textContent;
                                    navigator.clipboard.writeText(content).then(() => {
                                        alert('内容已复制到剪贴板！');
                                    }).catch(err => {
                                        alert('复制失败，请手动选择复制');
                                    });
                                }
                            <\/script>
                        </body>
                        </html>
                    `);
                }
            })
            .catch(error => {
                console.error('获取任务结果失败:', error);
                showNotification('获取任务结果失败', 'error');
            });
        }

        function downloadResult(taskId, format = 'txt') {
            // 使用新的下载API端点
            const downloadUrl = `/tools/api/async/task/${taskId}/download/${format}/`;

            // 创建隐藏的下载链接
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.style.display = 'none';
            document.body.appendChild(link);

            // 触发下载
            link.click();

            // 清理
            document.body.removeChild(link);

            showNotification(`${format.toUpperCase()}格式文件下载中...`, 'success');
        }

        function toggleDownloadMenu(taskId) {
            const menu = document.getElementById(`downloadMenu_${taskId}`);
            if (menu) {
                // 关闭其他所有菜单
                document.querySelectorAll('.download-menu').forEach(m => {
                    if (m.id !== `downloadMenu_${taskId}`) {
                        m.classList.remove('show');
                    }
                });

                // 切换当前菜单
                menu.classList.toggle('show');
            }
        }

        function generateXmindContent(testCaseText) {
            // 生成XMind格式的XML内容
            const lines = testCaseText.split('\n');
            let xmlContent = '<?xml version="1.0" encoding="UTF-8"?>' + '\\n';
            xmlContent += '<map version="1.0.1">' + '\\n';
            xmlContent += '  <node TEXT="测试用例文档" STYLE_ATTR="bubble" COLOR_ATTR="#000000">' + '\\n';

            let currentModule = null;
            let moduleNode = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // 检测模块标题
                if (line.startsWith('## ')) {
                    if (currentModule) {
                        xmlContent += '    </node>\\n';
                    }
                    currentModule = line.substring(3).trim();
                    xmlContent += `    <node TEXT="${escapeXml(currentModule)}" COLOR_ATTR="#FF7F50" STYLE_ATTR="fork">\\n`;
                }
                // 检测测试用例
                else if (line.startsWith('### ') && currentModule) {
                    const testCase = line.substring(4).trim();
                    xmlContent += `      <node TEXT="${escapeXml(testCase)}" COLOR_ATTR="#4682B4" STYLE_ATTR="bullet"/>\\n`;
                }
                // 检测用例详情
                else if (line.startsWith('- ') && currentModule) {
                    const detail = line.substring(2).trim();
                    xmlContent += `      <node TEXT="${escapeXml(detail)}" COLOR_ATTR="#32CD32" STYLE_ATTR="bullet"/>\\n`;
                }
            }

            if (currentModule) {
                xmlContent += '    </node>\\n';
            }

            xmlContent += '  </node>\\n';
            xmlContent += '</map>';

            return xmlContent;
        }

        function generateFeishuContent(testCaseText) {
            // 生成飞书兼容的Markdown内容
            let feishuContent = '# 测试用例文档\n\n';
            feishuContent += '> 本文档由AI测试用例生成器自动生成，支持飞书直接导入\n\n';

            const lines = testCaseText.split('\n');
            let currentModule = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // 检测模块标题
                if (line.startsWith('## ')) {
                    if (currentModule) {
                        feishuContent += '\n---\n\n';
                    }
                    currentModule = line.substring(3).trim();
                    feishuContent += `## 📋 ${currentModule}\n\n`;
                }
                // 检测测试用例
                else if (line.startsWith('### ')) {
                    const testCase = line.substring(4).trim();
                    feishuContent += `### ✅ ${testCase}\n\n`;
                }
                // 检测用例详情
                else if (line.startsWith('- ')) {
                    const detail = line.substring(2).trim();
                    feishuContent += `- ${detail}\n`;
                }
                // 其他内容
                else if (line) {
                    feishuContent += `${line}\n`;
                }
            }

            feishuContent += '\n---\n\n';
            feishuContent += '## 📊 文档信息\n\n';
            feishuContent += '- **生成时间**: ' + new Date().toLocaleString() + '\n';
            feishuContent += '- **生成工具**: AI测试用例生成器\n';
            feishuContent += '- **格式**: 飞书兼容Markdown\n';
            feishuContent += '- **用途**: 可直接导入飞书文档使用\n\n';

            return feishuContent;
        }

        function escapeXml(text) {
            return text.replace(/&/g, '&amp;')
                     .replace(/</g, '&lt;')
                     .replace(/>/g, '&gt;')
                     .replace(/"/g, '&quot;')
                     .replace(/'/g, '&apos;');
        }

        function viewError(taskId) {
            // 获取任务详情并显示错误
            axios.get(`/tools/api/async/task/${taskId}/`)
            .then(response => {
                if (response.data.success && response.data.error) {
                    showNotification(`任务错误: ${response.data.error}`, 'error');
                }
            })
            .catch(error => {
                console.error('获取任务错误失败:', error);
                showNotification('获取任务错误失败', 'error');
            });
        }

        function deleteTask(taskId) {
            // 确认删除
            if (!confirm('确定要删除这个任务吗？\n\n注意：如果任务正在运行，将会被停止并删除。')) {
                return;
            }

            // 发送删除请求
            axios.post('/tools/api/async/task/delete/', {
                task_id: taskId
            })
            .then(response => {
                if (response.data.success) {
                    // 删除成功，刷新任务列表
                    loadTasks();
                    showNotification('任务删除成功！', 'success');
                } else {
                    showNotification('删除失败: ' + response.data.error, 'error');
                }
            })
            .catch(error => {
                console.error('删除任务失败:', error);
                showNotification('删除任务失败，请稍后重试', 'error');
            });
        }

        function getRemainingTime(createdAt) {
            const created = new Date(createdAt);
            const now = new Date();
            const timeoutMs = 60 * 60 * 1000; // 1小时
            const elapsed = now - created;
            const remaining = timeoutMs - elapsed;

            if (remaining <= 0) {
                return '已超时';
            }

            const minutes = Math.floor(remaining / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            if (minutes > 0) {
                return `${minutes}分${seconds}秒`;
            } else {
                return `${seconds}秒`;
            }
        }

        function isTaskNearTimeout(createdAt) {
            const created = new Date(createdAt);
            const now = new Date();
            const timeoutMs = 60 * 60 * 1000; // 1小时
            const elapsed = now - created;
            const remaining = timeoutMs - elapsed;

            // 如果剩余时间少于10分钟，显示警告
            return remaining < 10 * 60 * 1000;
        }

        function updateRemainingTimes() {
            // 更新所有任务的剩余时间显示
            const taskItems = document.querySelectorAll('.task-item');
            taskItems.forEach(item => {
                const timeElement = item.querySelector('.task-meta span[style*="color"]');
                if (timeElement && timeElement.textContent.includes('剩余时间:')) {
                    // 从任务ID获取创建时间（这里需要从数据中获取，简化处理）
                    const taskId = item.querySelector('.task-id').textContent;
                    // 这里可以优化为从全局任务数据中获取创建时间
                    // 暂时跳过，因为需要重构数据结构
                }
            });
        }

        // 消息通知系统
        function showNotification(message, type = 'info') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas ${getNotificationIcon(type)}"></i>
                    <span>${message}</span>
                </div>
            `;

            // 添加到页面
            document.body.appendChild(notification);

            // 显示动画
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);

            // 自动隐藏
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        function getNotificationIcon(type) {
            const icons = {
                'success': 'fa-check-circle',
                'error': 'fa-exclamation-circle',
                'warning': 'fa-exclamation-triangle',
                'info': 'fa-info-circle'
            };
            return icons[type] || 'fa-bell';
        }

        // 任务状态变化通知
        let lastTaskStates = {};

        function checkTaskStatusChanges(tasks) {
            tasks.forEach(task => {
                const taskId = task.id;
                const currentStatus = task.status;
                const lastStatus = lastTaskStates[taskId];

                // 如果状态发生变化
                if (lastStatus && lastStatus !== currentStatus) {
                    if (currentStatus === 'completed') {
                        showNotification(`任务 "${task.requirement.substring(0, 30)}..." 已完成！`, 'success');
                    } else if (currentStatus === 'failed') {
                        showNotification(`任务 "${task.requirement.substring(0, 30)}..." 执行失败`, 'error');
                    }
                }

                // 更新状态记录
                lastTaskStates[taskId] = currentStatus;
            });
        }
    </script>
