{% extends 'base.html' %}
{% block tool_title_inner %}14 天账号趋势{% endblock %}
{% block tool_title_display %}14 天账号趋势{% endblock %}
{% block extra_css %}<style>
.trend-page{min-height:100vh;padding:110px 24px 70px;background:linear-gradient(135deg,#667eea,#764ba2 45%,#f5576c);color:#fff}.trend-shell{max-width:1100px;margin:auto}.trend-head,.trend-card{padding:22px;border:1px solid rgba(255,255,255,.25);border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);margin-bottom:16px}.trend-head h1{margin:0 0 8px}.trend-head a{color:#fff}.trend-card h2{margin:0 0 4px}.trend-meta{color:rgba(255,255,255,.75);font-size:.9rem}.trend-chart{width:100%;height:180px}.trend-chart polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.trend-chart text{fill:rgba(255,255,255,.8);font-size:11px}.trend-legend{display:flex;gap:16px;flex-wrap:wrap;color:rgba(255,255,255,.85)}.trend-empty{color:rgba(255,255,255,.75)}
</style>{% endblock %}
{% block content %}<main class="trend-page"><div class="trend-shell"><section class="trend-head"><h1>14 天账号趋势</h1><p>按平台和关注对象查看粉丝、关注、获赞/收藏变化。</p><a href="{% url 'tools:peep' %}">← 返回正在关注</a></section><div id="trend-list"><p>正在加载趋势数据…</p></div></div></main><script>
(async()=>{const list=document.getElementById('trend-list');try{const r=await fetch('{% url "tools:xiaohongshu_agent_watches_api" %}',{credentials:'same-origin'});const data=await r.json();list.replaceChildren();for(const w of data.watches||[]){const points=w.trend||[];const keys=['fans','follows','interaction'];const labels={fans:'粉丝',follows:'关注',interaction:'获赞/收藏'};const card=document.createElement('section');card.className='trend-card';card.innerHTML=`<h2>${w.platform_label||w.platform||''} · ${w.nickname||w.user_id}</h2><div class="trend-meta">最近 14 天 · ${points.length} 个快照</div>`;const legend=document.createElement('div');legend.className='trend-legend';legend.textContent=keys.map(k=>`${labels[k]}：${points.at(-1)?.profile_counts?.[k]||'没有'}`).join('　');card.append(legend);let shown=false;for(const key of keys){const vals=points.map(p=>Number((p.profile_counts||{})[key])).filter(Number.isFinite);if(vals.length<2)continue;shown=true;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 700 180');svg.classList.add('trend-chart');const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;const coords=vals.map((v,i)=>`${10+i*680/Math.max(vals.length-1,1)},${160-(v-min)/span*130}`).join(' ');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',coords);svg.append(line);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x','10');label.setAttribute('y','18');label.textContent=labels[key];svg.append(label);card.append(svg)}if(!shown){const e=document.createElement('p');e.className='trend-empty';e.textContent='快照不足 2 次，暂时无法绘制趋势。';card.append(e)}list.append(card)}}catch(e){list.textContent='趋势数据加载失败，请刷新页面重试。'}})();</script>{% endblock %}
