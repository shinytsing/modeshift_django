<!-- AI助手小机器人组件 -->
{% if user.is_authenticated %}
<div class="ai-assistant-container" id="aiAssistantContainer" style="display: block;">
    <div class="ai-assistant-wrapper">
        <!-- 智能按钮 - 机器人形态 -->
        <button class="ai-assistant-button" id="aiAssistantButton" onclick="handleMainButtonClick()">
            <div class="assistant-avatar">
                <i class="fas fa-robot" id="mainButtonIcon"></i>
                <div class="assistant-pulse"></div>
                <div class="robot-running-animation"></div>
            </div>
        </button>
        
        <!-- 聊天窗口 -->
        <div class="assistant-chat-window" id="assistantChatWindow" style="display: none;">
            <div class="chat-header">
                <div class="header-info">
                    <div class="assistant-avatar-small">
                        <i class="fas fa-terminal"></i>
                    </div>
                    <div class="assistant-info">
                        <h4>AI智能助手 v2.0</h4>
                        <span class="status-text">系统在线</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="share-button" onclick="event.stopPropagation(); shareCurrentPage();" title="分享当前页面">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button class="close-chat" onclick="toggleAssistantChat()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="assistantMessages">
                <!-- 欢迎消息 -->
                <div class="message assistant-message">
                    <div class="message-avatar">
                        <i class="fas fa-terminal"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <p>$> 系统初始化完成</p>
                        </div>
                        <div class="message-time">{{ now|date:"H:i" }}</div>
                    </div>
                </div>
                
                <!-- 系统功能清单 -->
                <div class="system-features">
                    <div class="features-header">
                        <i class="fas fa-terminal"></i>
                        <span>系统模块</span>
                    </div>
                    <div class="features-grid">
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/test_case_generator/')">
                            <i class="fas fa-terminal"></i>
                            <span>测试生成</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/travel_guide/')">
                            <i class="fas fa-map"></i>
                            <span>旅游工具</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/redbook_generator/')">
                            <i class="fas fa-code"></i>
                            <span>小红书</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/tarot/reading/')">
                            <i class="fas fa-magic"></i>
                            <span>塔罗占卜</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/meditation_guide/')">
                            <i class="fas fa-music"></i>
                            <span>冥想音频</span>
                        </div>
                        <div class="feature-item" onclick="sendQuickMessage('如何使用地图服务')">
                            <i class="fas fa-globe"></i>
                            <span>地图服务</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/chat/')">
                            <i class="fas fa-comments"></i>
                            <span>聊天系统</span>
                        </div>
                        <div class="feature-item" onclick="checkLoginAndNavigate('/tools/task_manager/')">
                            <i class="fas fa-tasks"></i>
                            <span>任务管理</span>
                        </div>
                    </div>
                </div>
                
            </div>
            
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input type="text" id="assistantInput" placeholder="输入你的问题或需求..." maxlength="500" onkeypress="handleAssistantKeyPress(event)">
                    <button class="send-button" onclick="sendAssistantMessage()">
                        <i class="fas fa-terminal"></i>
                    </button>
                </div>
                <div class="input-tips">
                    <span class="tip">💡 提示：可以直接描述你的需求，我会为你生成相应的内容</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// AI助手聊天功能
let isAssistantOpen = false;
let conversationHistory = [];

// 动态调整窗口大小功能
function adjustChatWindowSize() {
    const chatWindow = document.getElementById('assistantChatWindow');
    const messagesContainer = document.getElementById('assistantMessages');
    
    if (!chatWindow || !messagesContainer) return;
    
    // 计算内容高度
    const headerHeight = chatWindow.querySelector('.chat-header').offsetHeight;
    const inputHeight = chatWindow.querySelector('.chat-input-container').offsetHeight;
    const messagesHeight = messagesContainer.scrollHeight;
    
    // 计算总高度
    const totalHeight = headerHeight + messagesHeight + inputHeight + 30; // 30px为padding
    
    // 设置最小和最大高度限制
    const minHeight = 300;
    const maxHeight = Math.min(80 * window.innerHeight / 100, 600);
    
    // 应用高度
    const newHeight = Math.max(minHeight, Math.min(maxHeight, totalHeight));
    chatWindow.style.height = newHeight + 'px';
    
    // 滚动到底部显示最新消息
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// 发送助手消息
async function sendAssistantMessage() {
    const input = document.getElementById('assistantInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    // 清空输入框
    input.value = '';
    
    // 添加用户消息到聊天界面
    addMessageToChat(message, 'user');
    
    // 显示加载指示器
    showTypingIndicator();
    
    try {
        // 调用AI API
        const response = await fetch('/tools/api/ai-assistant/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                message: message,
                history: conversationHistory.slice(-5) // 只发送最近5条历史记录
            })
        });
        
        const data = await response.json();
        
        // 隐藏加载指示器
        hideTypingIndicator();
        
        if (data.success) {
            // 添加AI回复到聊天界面
            addMessageToChat(data.response, 'assistant');
            
            // 更新对话历史
            conversationHistory.push(
                { role: 'user', content: message },
                { role: 'assistant', content: data.response }
            );
        } else {
            // 显示错误消息
            addMessageToChat(`抱歉，发生了错误：${data.error}`, 'assistant');
        }
        
    } catch (error) {
        // 隐藏加载指示器
        hideTypingIndicator();
        
        // 显示错误消息
        addMessageToChat('抱歉，网络连接出现问题，请稍后重试。', 'assistant');
        // console.error(...)
    }
}

// 获取CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 拖动功能实现
function initializeDragFunctionality() {
    const chatWindow = document.getElementById('assistantChatWindow');
    const chatHeader = chatWindow.querySelector('.chat-header');
    
    if (!chatHeader) return;
    
    // 鼠标按下事件
    chatHeader.addEventListener('mousedown', function(e) {
        // 如果点击的是关闭按钮或分享按钮，不启动拖动
        if (e.target.closest('.close-chat') || e.target.closest('.share-button')) {
            return;
        }
        
        isDragging = true;
        chatWindow.classList.add('dragging');
        
        // 计算鼠标相对于窗口的偏移量
        const rect = chatWindow.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        
        // 防止文本选择
        e.preventDefault();
    });
    
    // 鼠标移动事件
    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        
        e.preventDefault();
        
        // 计算新位置
        let newX = e.clientX - dragOffset.x;
        let newY = e.clientY - dragOffset.y;
        
        // 限制在视窗范围内
        const maxX = window.innerWidth - chatWindow.offsetWidth;
        const maxY = window.innerHeight - chatWindow.offsetHeight;
        
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        
        // 应用新位置
        chatWindow.style.left = newX + 'px';
        chatWindow.style.top = newY + 'px';
        chatWindow.style.right = 'auto';
        chatWindow.style.bottom = 'auto';
    });
    
    // 鼠标释放事件
    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            chatWindow.classList.remove('dragging');
        }
    });
    
    // 触摸事件支持（移动设备）
    chatHeader.addEventListener('touchstart', function(e) {
        if (e.target.closest('.close-chat') || e.target.closest('.share-button')) {
            return;
        }
        
        isDragging = true;
        chatWindow.classList.add('dragging');
        
        const touch = e.touches[0];
        const rect = chatWindow.getBoundingClientRect();
        dragOffset.x = touch.clientX - rect.left;
        dragOffset.y = touch.clientY - rect.top;
        
        e.preventDefault();
    });
    
    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        
        e.preventDefault();
        
        const touch = e.touches[0];
        let newX = touch.clientX - dragOffset.x;
        let newY = touch.clientY - dragOffset.y;
        
        const maxX = window.innerWidth - chatWindow.offsetWidth;
        const maxY = window.innerHeight - chatWindow.offsetHeight;
        
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        
        chatWindow.style.left = newX + 'px';
        chatWindow.style.top = newY + 'px';
        chatWindow.style.right = 'auto';
        chatWindow.style.bottom = 'auto';
    });
    
    document.addEventListener('touchend', function() {
        if (isDragging) {
            isDragging = false;
            chatWindow.classList.remove('dragging');
        }
    });
}

// 复制分享链接
function copyShareUrl() {
    const urlInput = document.getElementById('shareUrl');
    urlInput.select();
    urlInput.setSelectionRange(0, 99999); // 移动设备兼容
    
    try {
        document.execCommand('copy');
        // 显示复制成功提示
        showCopySuccess();
    } catch (err) {
        // 降级处理：使用现代API
        if (navigator.clipboard) {
            navigator.clipboard.writeText(urlInput.value).then(() => {
                showCopySuccess();
            });
        }
    }
}

// 显示复制成功提示
function showCopySuccess() {
    const button = event.target;
    const originalText = button.textContent;
    button.textContent = '已复制!';
    button.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
    
    setTimeout(() => {
        button.textContent = originalText;
        button.style.background = 'linear-gradient(135deg, #00ff41 0%, #00ff88 100%)';
    }, 2000);
}

    qrModal.appendChild(qrContent);
    document.body.appendChild(qrModal);
    
    // 点击背景关闭
    qrModal.onclick = function(e) {
        if (e.target === qrModal) {
            closeQRModal();
        }
    };
    
    // 点击内容区域阻止关闭
    qrContent.onclick = function(e) {
        e.stopPropagation();
    };
    
    // 添加模拟扫码检测（虽然无法真正检测，但可以添加定时器）
    let scanCheckCount = 0;
    const maxScanChecks = 30; // 30秒后自动关闭
    
    console.log('启动30秒自动关闭定时器');
    
    const scanCheckInterval = setInterval(() => {
        scanCheckCount++;
        console.log(`扫码检测倒计时: ${maxScanChecks - scanCheckCount}秒`);
        
        // 模拟检测到扫码（随机概率）
        if (Math.random() < 0.1 && scanCheckCount > 5) { // 5秒后开始有10%概率检测到扫码
            console.log('检测到扫码，自动关闭二维码');
            clearInterval(scanCheckInterval);
            closeQRModal();
            return;
        }
        
        // 30秒后强制关闭
        if (scanCheckCount >= maxScanChecks) {
            console.log('30秒超时，自动关闭二维码');
            clearInterval(scanCheckInterval);
            closeQRModal();
        }
    }, 1000);
    
    // 保存定时器引用以便清理
    qrModal.scanCheckInterval = scanCheckInterval;
    
    // 存储二维码模态框引用
    window.currentQRModal = qrModal;
}

// 关闭分享模态框
function closeShareModal() {
    console.log('尝试关闭分享模态框...');
    
    // 最简单的方法：直接移除所有模态框
    const modals = document.querySelectorAll('div[style*="z-index: 10000"], .share-modal, #shareModal');
    console.log('找到的分享模态框数量:', modals.length);
    
    modals.forEach(modal => {
        if (modal && modal.parentNode) {
            console.log('移除分享模态框:', modal);
            modal.remove();
        }
    });
    
    // 清除全局引用
    window.currentShareModal = null;
    
    console.log('关闭分享模态框完成');
}

// 关闭二维码模态框
function closeQRModal() {
    console.log('关闭二维码模态框');
    
    // 查找并移除所有二维码模态框
    const modals = document.querySelectorAll('.qr-modal, #qrModal, div[style*="z-index: 10002"]');
    console.log('找到的二维码模态框数量:', modals.length);
    
    modals.forEach(modal => {
        if (modal && modal.parentNode) {
            console.log('移除二维码模态框:', modal);
            
            // 清理扫码检测定时器
            if (modal.scanCheckInterval) {
                clearInterval(modal.scanCheckInterval);
            }
            
            modal.remove();
        }
    });
    
    // 清除全局引用和定时器
    window.currentQRModal = null;
    if (window.qrAutoCloseTimer) {
        clearTimeout(window.qrAutoCloseTimer);
        window.qrAutoCloseTimer = null;
    }
    
    console.log('二维码模态框已关闭');
}

// 全局关闭所有模态框的函数
function closeAllModals() {
    console.log('关闭所有模态框 - 开始');
    console.log('当前页面上的模态框:', document.querySelectorAll('div[style*="z-index: 10000"], div[style*="z-index: 10002"]'));
    
    // 强制关闭所有可能的模态框
    const allModals = document.querySelectorAll('#shareModal, #qrModal, .share-modal, .qr-modal, div[style*="z-index: 10000"], div[style*="z-index: 10002"]');
    console.log('找到的所有模态框:', allModals.length);
    
    allModals.forEach(modal => {
        if (modal && modal.parentNode) {
            console.log('强制移除模态框:', modal);
            modal.remove();
        }
    });
    
    closeShareModal();
    closeQRModal();
    
    console.log('关闭所有模态框 - 完成');
}

// ESC键关闭模态框
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        console.log('ESC键被按下，尝试关闭模态框');
        e.preventDefault();
        e.stopPropagation();
        closeAllModals();
    }
});

window.closeShareModal = closeShareModal;
