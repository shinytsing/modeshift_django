<script>
// AI助手聊天功能
let isAssistantOpen = false;
let conversationHistory = [];

// 拖动功能变量
let isDragging = false;
let dragOffset = { x: 0, y: 0 };

// 动态调整窗口大小功能
function adjustChatWindowSize() {
    const chatWindow = document.getElementById('assistantChatWindow');
    const messagesContainer = document.getElementById('assistantMessages');
    
    if (!chatWindow || !messagesContainer) return;
    
    // 计算内容高度
    const headerHeight = chatWindow.querySelector('.chat-header').offsetHeight;
    const inputHeight = chatWindow.querySelector('.chat-input-container').offsetHeight;
    const messagesHeight = messagesContainer.scrollHeight;
    
    // 计算总高度
    const totalHeight = headerHeight + messagesHeight + inputHeight + 30; // 30px为padding
    
    // 设置最小和最大高度限制
    const minHeight = 300;
    const maxHeight = Math.min(80 * window.innerHeight / 100, 600);
    
    // 应用高度
    const newHeight = Math.max(minHeight, Math.min(maxHeight, totalHeight));
    chatWindow.style.height = newHeight + 'px';
    
    // 滚动到底部显示最新消息
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// 切换助手聊天窗口
function toggleAssistantChat() {
    const chatWindow = document.getElementById('assistantChatWindow');
    const button = document.getElementById('aiAssistantButton');
    
    isAssistantOpen = !isAssistantOpen;
    
    if (isAssistantOpen) {
        chatWindow.style.display = 'flex';
        button.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
        // 调整窗口大小并聚焦到输入框
        setTimeout(() => {
            adjustChatWindowSize();
            document.getElementById('assistantInput').focus();
        }, 300);
    } else {
        chatWindow.style.display = 'none';
        button.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
    }
}

// 发送快捷消息
function sendQuickMessage(message) {
    const input = document.getElementById('assistantInput');
    input.value = message;
    sendAssistantMessage();
}

// 处理回车键发送
function handleAssistantKeyPress(event) {
    if (event.key === 'Enter') {
        sendAssistantMessage();
    }
}

// 发送助手消息
async function sendAssistantMessage() {
    const input = document.getElementById('assistantInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    // 清空输入框
    input.value = '';
    
    // 添加用户消息到聊天界面
    addMessageToChat(message, 'user');
    
    // 显示加载指示器
    showTypingIndicator();
    
    try {
        // 调用AI API
        const response = await fetch('/tools/api/ai-assistant/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                message: message,
                history: conversationHistory.slice(-5) // 只发送最近5条历史记录
            })
        });
        
        const data = await response.json();
        
        // 隐藏加载指示器
        hideTypingIndicator();
        
        if (data.success) {
            // 添加AI回复到聊天界面
            addMessageToChat(data.response, 'assistant');
            
            // 更新对话历史
            conversationHistory.push(
                { role: 'user', content: message },
                { role: 'assistant', content: data.response }
            );
        } else {
            // 显示错误消息
            addMessageToChat(`抱歉，发生了错误：${data.error}`, 'assistant');
        }
        
    } catch (error) {
        // 隐藏加载指示器
        hideTypingIndicator();
        
        // 显示错误消息
        addMessageToChat('抱歉，网络连接出现问题，请稍后重试。', 'assistant');
        console.error('AI助手请求失败:', error);
    }
}

// 添加消息到聊天界面
function addMessageToChat(content, sender) {
    const messagesContainer = document.getElementById('assistantMessages');
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}-message`;
    
    const avatar = sender === 'user' ? 
        '<i class="fas fa-user"></i>' : 
        '<i class="fas fa-terminal"></i>';
    
    const currentTime = new Date().toLocaleTimeString('zh-CN', {
        hour: '2-digit',
        minute: '2-digit'
    });
    
    messageDiv.innerHTML = `
        <div class="message-avatar">
            ${avatar}
        </div>
        <div class="message-content">
            <div class="message-bubble">
                <p>${content.replace(/\n/g, '<br>')}</p>
            </div>
            <div class="message-time">${currentTime}</div>
        </div>
    `;
    
    messagesContainer.appendChild(messageDiv);
    
    // 延迟调整窗口大小，确保DOM更新完成
    setTimeout(() => {
        adjustChatWindowSize();
    }, 100);
}

// 获取CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 拖动功能实现
function initializeDragFunctionality() {
    const chatWindow = document.getElementById('assistantChatWindow');
    const chatHeader = chatWindow.querySelector('.chat-header');
    
    if (!chatHeader) return;
    
    // 鼠标按下事件
    chatHeader.addEventListener('mousedown', function(e) {
        // 如果点击的是关闭按钮，不启动拖动
        if (e.target.closest('.close-chat')) {
            return;
        }
        
        isDragging = true;
        chatWindow.classList.add('dragging');
        
        // 计算鼠标相对于窗口的偏移量
        const rect = chatWindow.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        
        // 防止文本选择
        e.preventDefault();
    });
    
    // 鼠标移动事件
    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        
        e.preventDefault();
        
        // 计算新位置
        let newX = e.clientX - dragOffset.x;
        let newY = e.clientY - dragOffset.y;
        
        // 限制在视窗范围内
        const maxX = window.innerWidth - chatWindow.offsetWidth;
        const maxY = window.innerHeight - chatWindow.offsetHeight;
        
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        
        // 应用新位置
        chatWindow.style.left = newX + 'px';
        chatWindow.style.top = newY + 'px';
        chatWindow.style.right = 'auto';
        chatWindow.style.bottom = 'auto';
    });
    
    // 鼠标释放事件
    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            chatWindow.classList.remove('dragging');
        }
    });
    
    // 触摸事件支持（移动设备）
    chatHeader.addEventListener('touchstart', function(e) {
        if (e.target.closest('.close-chat')) {
            return;
        }
        
        isDragging = true;
        chatWindow.classList.add('dragging');
        
        const touch = e.touches[0];
        const rect = chatWindow.getBoundingClientRect();
        dragOffset.x = touch.clientX - rect.left;
        dragOffset.y = touch.clientY - rect.top;
        
        e.preventDefault();
    });
    
    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        
        e.preventDefault();
        
        const touch = e.touches[0];
        let newX = touch.clientX - dragOffset.x;
        let newY = touch.clientY - dragOffset.y;
        
        const maxX = window.innerWidth - chatWindow.offsetWidth;
        const maxY = window.innerHeight - chatWindow.offsetHeight;
        
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        
        chatWindow.style.left = newX + 'px';
        chatWindow.style.top = newY + 'px';
        chatWindow.style.right = 'auto';
        chatWindow.style.bottom = 'auto';
    });
    
    document.addEventListener('touchend', function() {
        if (isDragging) {
            isDragging = false;
            chatWindow.classList.remove('dragging');
        }
    });
}
