<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误动画测试</title>
    <style>
        body {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
            background: #000;
            color: #00ff00;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
        }
        
        .terminal-messages {
            margin-bottom: 25px;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .message-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .message-prefix {
            color: #00ff00;
            font-weight: bold;
            min-width: 80px;
        }
        
        .message-text {
            color: #ffffff;
        }
        
        .message-text.message-error {
            color: #ff6666;
        }
        
        .message-text.message-success {
            color: #00ff00;
        }
        
        .message-text.message-info {
            color: #00ffff;
        }
        
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .test-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 3px;
        }
        
        .test-btn:hover {
            background: #00cc00;
        }
        
        /* 错误动画样式 */
        .error-animation {
            animation: errorBlink 0.5s ease-in-out 3;
        }
        
        .error-prefix {
            color: #ff0000 !important;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .error-text {
            color: #ff6666 !important;
            text-shadow: 0 0 5px #ff0000;
        }
        
        /* 错误闪烁动画 */
        @keyframes errorBlink {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.3; 
                transform: scale(1.05);
            }
        }
        
        /* 震动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        /* 边框闪烁动画 */
        @keyframes borderFlash {
            0%, 100% { 
                border-color: #ff0000;
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            50% { 
                border-color: #ff6666;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 错误动画测试页面</h1>
        <p>测试极客登录弹窗的错误动画效果</p>
        
        <div class="test-buttons">
            <button class="test-btn" onclick="testNormalMessage()">普通消息</button>
            <button class="test-btn" onclick="testErrorAnimation()">错误动画</button>
            <button class="test-btn" onclick="testSuccessMessage()">成功消息</button>
            <button class="test-btn" onclick="clearMessages()">清空消息</button>
        </div>
        
        <div class="terminal-messages" id="terminalMessages">
            <div class="message-line">
                <span class="message-prefix">[INFO]</span>
                <span class="message-text">点击按钮测试不同的消息效果</span>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>动画效果说明：</h3>
            <ul>
                <li><strong>错误动画</strong>：消息闪烁3次 + 红色发光效果 + 震动效果 + 边框闪烁</li>
                <li><strong>普通消息</strong>：正常显示，无动画</li>
                <li><strong>成功消息</strong>：绿色显示，无动画</li>
            </ul>
        </div>
    </div>

    <script>
        // 显示终端消息
        function showTerminalMessage(message, type = 'info') {
            const messagesContainer = document.getElementById('terminalMessages');
            if (messagesContainer) {
                // 清空所有现有消息
                messagesContainer.innerHTML = '';
                
                const messageLine = document.createElement('div');
                messageLine.className = 'message-line';
                
                const prefix = document.createElement('span');
                prefix.className = 'message-prefix';
                prefix.textContent = type.toUpperCase();
                
                const text = document.createElement('span');
                text.className = `message-text message-${type}`;
                text.textContent = message;
                
                messageLine.appendChild(prefix);
                messageLine.appendChild(text);
                messagesContainer.appendChild(messageLine);
                
                // 滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // 显示错误动画提示
        function showErrorAnimation(message, type = 'error') {
            const messagesContainer = document.getElementById('terminalMessages');
            if (!messagesContainer) return;
            
            // 清空现有消息
            messagesContainer.innerHTML = '';
            
            // 创建错误消息行
            const messageLine = document.createElement('div');
            messageLine.className = 'message-line error-animation';
            
            const prefix = document.createElement('span');
            prefix.className = 'message-prefix error-prefix';
            prefix.textContent = type.toUpperCase();
            
            const text = document.createElement('span');
            text.className = `message-text message-${type} error-text`;
            text.textContent = message;
            
            messageLine.appendChild(prefix);
            messageLine.appendChild(text);
            messagesContainer.appendChild(messageLine);
            
            // 添加闪烁动画
            messageLine.style.animation = 'errorBlink 0.5s ease-in-out 3';
            
            // 添加震动效果
            const container = document.querySelector('.test-container');
            if (container) {
                container.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(() => {
                    container.style.animation = '';
                }, 500);
            }
            
            // 添加红色边框闪烁
            if (container) {
                container.style.border = '2px solid #ff0000';
                container.style.animation = 'borderFlash 0.5s ease-in-out 3';
                setTimeout(() => {
                    container.style.border = '';
                    container.style.animation = '';
                }, 1500);
            }
            
            // 播放错误音效（如果支持）
            playErrorSound();
            
            // 3秒后恢复正常状态
            setTimeout(() => {
                messageLine.style.animation = '';
            }, 1500);
        }

        // 播放错误音效
        function playErrorSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(150, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(100, audioContext.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (error) {
                // // console.log(...)
            }
        }

        // 测试函数
        function testNormalMessage() {
            showTerminalMessage('[INFO] 这是一个普通的终端消息', 'info');  // 调试信息已隐藏
        }

        function testErrorAnimation() {
            showErrorAnimation('[ERROR] 这是一个错误动画测试！', 'error');
        }

        function testSuccessMessage() {
            showTerminalMessage('[SUCCESS] 操作成功完成！', 'success');
        }

        function clearMessages() {
            const messagesContainer = document.getElementById('terminalMessages');
            messagesContainer.innerHTML = '';
        }
    </script>
</body>
</html>
