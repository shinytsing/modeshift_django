name: 🚀 自动部署 + 线上测试

on:
  push:
    branches: [main]

jobs:
  deploy-and-test:
    name: 🚀 自动部署 + 线上测试
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
    - name: ⬇️ 检出代码
      uses: actions/checkout@v4
    
    - name: 🚀 一键部署 + 线上测试
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        WEB_URL: ${{ secrets.WEB_URL }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "🚀 开始自动部署 + 线上测试..."
        
        # 检查环境变量
        if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
          echo "❌ 缺少必要的GitHub Secrets配置"
          echo "请确保设置了以下Secrets:"
          echo "- SERVER_HOST: 47.103.143.152"
          echo "- SERVER_USER: root"
          echo "- SERVER_SSH_KEY: SSH私钥"
          echo "- DEPLOY_PATH: /root/modeshift_django"
          echo "- WEB_URL: https://shenyinqing.xin"
          echo "- API_URL: https://shenyinqing.xin"
          exit 1
        fi
        
        echo "✅ 环境变量检查通过"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        echo "🔗 测试SSH连接..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $USERNAME@$HOST "echo 'SSH连接成功'" || {
          echo "❌ SSH连接失败"
          exit 1
        }
        
        echo "✅ SSH连接正常"
        
        # 一键部署
        echo "📦 开始一键部署..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          
          echo '📥 拉取最新代码...' &&
          git config --global http.sslVerify false &&
          git config --global http.postBuffer 524288000 &&
          git pull origin main &&
          
          echo '🐍 智能虚拟环境管理...' &&
          if [ ! -d 'venv' ] || [ requirements.txt -nt venv/pyvenv.cfg ]; then
            echo '创建/更新虚拟环境...' &&
            rm -rf venv &&
            python3 -m venv venv &&
            venv/bin/python -m pip install --upgrade pip --quiet &&
            venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
          else
            echo '虚拟环境无需更新'
          fi &&
          
          echo '📁 Django操作...' &&
          venv/bin/python manage.py collectstatic --noinput --clear &&
          venv/bin/python manage.py migrate --noinput &&
          
          echo '🔄 智能服务重启...' &&
          pkill -TERM -f gunicorn || true &&
          sleep 2 &&
          nohup venv/bin/gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 wsgi:application --daemon &&
          sudo nginx -s reload &&
          
          echo '✅ 部署完成'
        "
        
        echo "🎉 部署成功！"
        
        # 线上测试
        echo "🔍 开始线上测试..."
        
        WEB_URL="$WEB_URL"
        API_URL="$API_URL"
        
        if [ -z "$WEB_URL" ] || [ -z "$API_URL" ]; then
          echo "❌ 缺少URL配置"
          echo "请在GitHub Secrets中设置WEB_URL和API_URL"
          exit 1
        fi
        
        echo "✅ 测试目标: $WEB_URL"
        
        # 等待服务启动
        echo "⏳ 等待服务启动..."
        sleep 15
        
        # 测试函数
        test_endpoint() {
          local url=$1
          local name=$2
          local timeout=${3:-10}
          
          echo "🔍 测试 $name..."
          if curl -f -s --max-time $timeout "$url" > /dev/null; then
            echo "✅ $name 正常"
            return 0
          else
            echo "❌ $name 失败"
            return 1
          fi
        }
        
        # 核心功能测试
        echo "📊 开始核心功能测试..."
        
        # 网页测试
        test_endpoint "$WEB_URL/" "首页" 10
        test_endpoint "$WEB_URL/admin/" "管理后台" 10
        test_endpoint "$WEB_URL/static/" "静态文件" 10
        
        # API测试
        test_endpoint "$API_URL/api/" "API根路径" 10
        test_endpoint "$API_URL/health/" "健康检查" 10
        test_endpoint "$API_URL/api/users/" "用户API" 10
        test_endpoint "$API_URL/api/tools/" "工具API" 10
        
        # 性能测试
        echo "⚡ 性能测试..."
        response_time=$(curl -o /dev/null -s -w '%{time_total}' --max-time 10 "$WEB_URL/")
        echo "📈 响应时间: ${response_time}秒"
        
        # 状态码测试
        status_code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 10 "$WEB_URL/")
        echo "📊 HTTP状态码: $status_code"
        
        if [ "$status_code" = "200" ]; then
          echo "✅ 状态码正常"
        else
          echo "⚠️ 状态码异常: $status_code"
        fi
        
        # SSL测试
        if [[ "$WEB_URL" == https://* ]]; then
          echo "🔒 SSL证书测试..."
          domain_name=$(echo $WEB_URL | sed 's|https://||' | cut -d'/' -f1)
          if echo | openssl s_client -servername $domain_name -connect $domain_name:443 2>/dev/null | openssl x509 -noout -dates 2>/dev/null; then
            echo "✅ SSL证书正常"
          else
            echo "⚠️ SSL证书检测失败"
          fi
        fi
        
        echo "🎉 线上测试完成！"
        echo "🌐 网站地址: $WEB_URL"
        echo "🔌 API地址: $API_URL"
        echo "✅ 自动部署 + 线上测试全部成功！"
