name: 🚀 自动部署到生产环境

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SERVER_HOST: 47.103.143.152
  SERVER_DOMAIN: shenyiqing.xin
  SERVER_USER: root
  DEPLOY_PATH: /root/modeshift_django
  PROJECT_NAME: modeshift_django

jobs:
  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy bandit safety

      - name: 🔍 代码风格检查
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🎨 代码格式化检查
        run: |
          black --check .
          isort --check-only .

      - name: 🔒 安全扫描
        run: |
          bandit -r . -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: 📊 类型检查
        run: |
          mypy . --ignore-missing-imports || true

      - name: 🧪 运行测试
        run: |
          python manage.py test --verbosity=2

      - name: 📤 上传质量报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: quality-reports
          path: |
            bandit-report.json
            safety-report.json
            mypy-report.xml

  # 构建和部署
  deploy:
    needs: code-quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🔧 配置SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_HOST ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC..." >> ~/.ssh/known_hosts
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

      - name: 🚀 部署到服务器
        run: |
          # 创建部署脚本
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          # 颜色定义
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          
          log() {
              echo -e "${BLUE}[$(date +'%H:%M:%S')]${NC} $1"
          }
          
          success() {
              echo -e "${GREEN}✅ $1${NC}"
          }
          
          error() {
              echo -e "${RED}❌ $1${NC}"
          }
          
          warning() {
              echo -e "${YELLOW}⚠️  $1${NC}"
          }
          
          # 部署函数
          deploy() {
              log "开始部署到生产环境..."
              
              # 进入部署目录
              cd $DEPLOY_PATH
              
              # 拉取最新代码
              log "拉取最新代码..."
              git fetch origin
              git reset --hard origin/main
              
              # 检查虚拟环境
              if [ ! -d 'venv' ]; then
                  log "创建虚拟环境..."
                  python3 -m venv venv
              fi
              
              # 激活虚拟环境并安装依赖
              log "安装Python依赖..."
              venv/bin/python -m pip install --upgrade pip --quiet
              venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
              
              # Django操作
              log "执行Django操作..."
              venv/bin/python manage.py collectstatic --noinput --clear
              venv/bin/python manage.py migrate --noinput
              
              # 重启服务
              log "重启服务..."
              pkill -TERM -f gunicorn || true
              sleep 2
              nohup venv/bin/gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 wsgi:application --daemon
              
              # 重启Nginx
              systemctl reload nginx
              
              success "部署完成"
          }
          
          # 健康检查
          health_check() {
              log "执行健康检查..."
              
              local max_attempts=10
              local attempt=1
              
              while [ $attempt -le $max_attempts ]; do
                  log "健康检查尝试 $attempt/$max_attempts..."
                  
                  if curl -f -s --max-time 10 "http://$SERVER_HOST/" > /dev/null 2>&1; then
                      success "网站访问正常"
                      break
                  else
                      warning "访问失败，等待重试..."
                      sleep 10
                      attempt=$((attempt + 1))
                  fi
              done
              
              if [ $attempt -gt $max_attempts ]; then
                  error "健康检查失败"
                  return 1
              fi
              
              success "健康检查完成"
          }
          
          # 执行部署
          deploy
          health_check
          EOF
          
          chmod +x deploy.sh
          
          # 执行部署
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'bash -s' < deploy.sh

      - name: 🏥 健康检查
        run: |
          # 等待服务启动
          sleep 15
          
          # 检查关键端点
          endpoints=(
              "http://$SERVER_HOST/"
              "http://$SERVER_HOST/admin/"
              "http://$SERVER_HOST/health/"
              "http://$SERVER_DOMAIN/"
          )
          
          for endpoint in "${endpoints[@]}"; do
              echo "检查端点: $endpoint"
              if curl -f -s --max-time 10 "$endpoint" > /dev/null 2>&1; then
                  echo "✅ $endpoint 正常"
              else
                  echo "❌ $endpoint 异常"
                  exit 1
              fi
          done

      - name: 📊 部署状态通知
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
              echo "🎉 部署成功！"
              echo "🌐 访问地址:"
              echo "  • http://$SERVER_HOST"
              echo "  • http://$SERVER_DOMAIN"
              echo "👤 管理员账号: admin / admin123"
          else
              echo "❌ 部署失败！"
              echo "请检查日志并重试"
          fi

  # 回滚功能
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🔄 回滚到上一个版本
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
              cd $DEPLOY_PATH
              
              # 回滚到上一个提交
              git log --oneline -5
              echo '请选择要回滚到的提交ID:'
              read -p '提交ID: ' commit_id
              
              if [ -n \"\$commit_id\" ]; then
                  git reset --hard \$commit_id
                  
                  # 重启服务
                  pkill -TERM -f gunicorn || true
                  sleep 2
                  nohup venv/bin/gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 wsgi:application --daemon
                  
                  echo '回滚完成'
              else
                  echo '未选择提交ID，取消回滚'
              fi
          "

  # 数据库备份
  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 💾 数据库备份
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
              cd $DEPLOY_PATH
              
              # 创建备份目录
              mkdir -p backups/\$(date +%Y%m%d)
              
              # 备份数据库
              venv/bin/python manage.py dumpdata --natural-foreign --natural-primary -e contenttypes -e auth.Permission > backups/\$(date +%Y%m%d)/database_backup_\$(date +%H%M%S).json
              
              # 备份媒体文件
              tar -czf backups/\$(date +%Y%m%d)/media_backup_\$(date +%H%M%S).tar.gz media/
              
              # 清理旧备份（保留7天）
              find backups/ -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
              
              echo '备份完成'
          "

  # 监控和告警
  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 📊 系统监控
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
              echo '=== 系统状态 ==='
              uptime
              echo ''
              echo '=== 内存使用 ==='
              free -h
              echo ''
              echo '=== 磁盘使用 ==='
              df -h
              echo ''
              echo '=== 服务状态 ==='
              systemctl status nginx --no-pager -l
              echo ''
              echo '=== 进程状态 ==='
              ps aux | grep gunicorn | grep -v grep
              echo ''
              echo '=== 端口监听 ==='
              netstat -tlnp | grep -E ':(80|8000|443)'
          "

      - name: 🚨 健康检查告警
        run: |
          # 检查关键端点
          endpoints=(
              \"http://$SERVER_HOST/\"
              \"http://$SERVER_HOST/health/\"
              \"http://$SERVER_DOMAIN/\"
          )
          
          failed_endpoints=()
          
          for endpoint in \"\${endpoints[@]}\"; do
              if ! curl -f -s --max-time 10 \"\$endpoint\" > /dev/null 2>&1; then
                  failed_endpoints+=(\"\$endpoint\")
              fi
          done
          
          if [ \${#failed_endpoints[@]} -gt 0 ]; then
              echo \"❌ 以下端点访问失败:\"
              for endpoint in \"\${failed_endpoints[@]}\"; do
                  echo \"  • \$endpoint\"
              done
              exit 1
          else
              echo \"✅ 所有端点访问正常\"
          fi
