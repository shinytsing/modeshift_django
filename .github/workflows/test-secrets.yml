name: 测试GitHub Secrets配置

on:
  workflow_dispatch:

jobs:
  test-secrets:
    name: 测试Secrets配置
    runs-on: ubuntu-latest
    steps:
    - name: 检查Secrets配置
      run: |
        echo "🔍 检查GitHub Secrets配置..."
        
        if [ -n "${{ secrets.SERVER_HOST }}" ]; then
          echo "✅ SERVER_HOST 已配置"
        else
          echo "❌ SERVER_HOST 未配置"
        fi
        
        if [ -n "${{ secrets.SERVER_USER }}" ]; then
          echo "✅ SERVER_USER 已配置"
        else
          echo "❌ SERVER_USER 未配置"
        fi
        
        if [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
          echo "✅ SERVER_SSH_KEY 已配置"
        else
          echo "❌ SERVER_SSH_KEY 未配置"
        fi
        
        if [ -n "${{ secrets.SERVER_PORT }}" ]; then
          echo "✅ SERVER_PORT 已配置: ${{ secrets.SERVER_PORT }}"
        else
          echo "⚠️ SERVER_PORT 未配置，将使用默认值22"
        fi
        
        echo ""
        echo "📋 Secrets配置总结:"
        echo "SERVER_HOST: ${{ secrets.SERVER_HOST }}"
        echo "SERVER_USER: ${{ secrets.SERVER_USER }}"
        echo "SERVER_SSH_KEY: [已配置]" 
        echo "SERVER_PORT: ${{ secrets.SERVER_PORT }}"
