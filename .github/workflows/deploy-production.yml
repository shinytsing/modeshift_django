name: 🚀 生产环境一键部署

# 可靠的CI/CD流程：代码检查 → 构建 → 部署 → 验证 → 通知
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: '部署方式'
        required: true
        default: 'docker'
        type: choice
        options:
        - docker
        - traditional
        - hybrid
      force_rebuild:
        description: '强制重建'
        required: false
        default: false
        type: boolean

env:
  # 服务器配置
  SERVER_HOST: "47.103.143.152"
  SERVER_USER: "root"
  SERVER_PORT: "22"
  DEPLOY_PATH: "/root/modeshift_django"
  
  # 应用配置
  APP_NAME: "modeshift_django"
  DOMAIN: "shenyiqing.xin"
  
  # 通知配置
  NOTIFICATION_EMAIL: "1009383129@qq.com"
  
  # Python版本
  PYTHON_VERSION: '3.11'

jobs:
  # ===== 代码质量检查 =====
  code-quality:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety
    
    - name: 代码格式检查
      run: |
        echo "🔍 检查代码格式..."
        black --check .
        isort --check-only .
    
    - name: 代码质量检查
      run: |
        echo "🔍 检查代码质量..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 安全扫描
      run: |
        echo "🔒 安全扫描..."
        bandit -r . -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true
    
    - name: 类型检查
      run: |
        echo "📝 类型检查..."
        mypy . --ignore-missing-imports || true

  # ===== 构建和测试 =====
  build-and-test:
    name: 🏗️ 构建和测试
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 15
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-django
    
    - name: 运行测试
      run: |
        echo "🧪 运行测试..."
        pytest --cov=. --cov-report=xml --cov-report=html || true
    
    - name: 构建Docker镜像
      run: |
        echo "🐳 构建Docker镜像..."
        docker build -t ${{ env.APP_NAME }}:latest .
        docker tag ${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}:${{ github.sha }}

  # ===== 服务器环境准备 =====
  prepare-server:
    name: 🛠️ 服务器环境准备
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    steps:
    - name: 检查SSH连接
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ env.SERVER_HOST }}
        username: ${{ env.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ env.SERVER_PORT }}
        script: |
          echo "✅ SSH连接成功！"
          echo "服务器信息:"
          echo "主机名: $(hostname)"
          echo "用户: $(whoami)"
          echo "当前目录: $(pwd)"
          echo "系统信息: $(uname -a)"
          echo "内存使用: $(free -h)"
          echo "磁盘使用: $(df -h)"
    
    - name: 安装必要软件
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ env.SERVER_HOST }}
        username: ${{ env.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ env.SERVER_PORT }}
        script: |
          echo "📦 安装必要软件..."
          
          # 更新系统
          apt-get update -y
          
          # 安装基础工具
          apt-get install -y curl wget git unzip software-properties-common
          
          # 安装Python 3.11
          if ! command -v python3.11 &> /dev/null; then
            echo "安装Python 3.11..."
            add-apt-repository ppa:deadsnakes/ppa -y
            apt-get update -y
            apt-get install -y python3.11 python3.11-venv python3.11-dev
            apt-get install -y python3-pip
          fi
          
          # 安装Docker
          if ! command -v docker &> /dev/null; then
            echo "安装Docker..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
            systemctl start docker
            systemctl enable docker
            usermod -aG docker root
          fi
          
          # 安装Docker Compose
          if ! command -v docker-compose &> /dev/null; then
            echo "安装Docker Compose..."
            curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
          fi
          
          # 安装PostgreSQL
          if ! command -v psql &> /dev/null; then
            echo "安装PostgreSQL..."
            apt-get install -y postgresql postgresql-contrib
            systemctl start postgresql
            systemctl enable postgresql
          fi
          
          # 安装Redis
          if ! command -v redis-server &> /dev/null; then
            echo "安装Redis..."
            apt-get install -y redis-server
            systemctl start redis-server
            systemctl enable redis-server
          fi
          
          # 安装Nginx
          if ! command -v nginx &> /dev/null; then
            echo "安装Nginx..."
            apt-get install -y nginx
            systemctl start nginx
            systemctl enable nginx
          fi
          
          echo "✅ 软件安装完成"

  # ===== 部署应用 =====
  deploy-application:
    name: 🚀 部署应用
    runs-on: ubuntu-latest
    needs: prepare-server
    timeout-minutes: 20
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 上传部署脚本
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.SERVER_HOST }}
        username: ${{ env.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ env.SERVER_PORT }}
        source: "scripts/deploy-server.sh"
        target: "/root/"
    
    - name: 执行部署
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ env.SERVER_HOST }}
        username: ${{ env.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ env.SERVER_PORT }}
        script_stop: true
        timeout: 600s
        command_timeout: 60s
        script: |
          echo "🚀 开始部署应用..."
          
          # 设置错误处理
          set -e
          set -o pipefail
          
          # 创建项目目录
          mkdir -p ${{ env.DEPLOY_PATH }}
          cd ${{ env.DEPLOY_PATH }}
          
          # 克隆或更新代码
          if [ ! -d ".git" ]; then
            echo "📥 克隆代码仓库..."
            git clone https://github.com/shinytsing/modeshift_django.git .
          else
            echo "📥 更新代码..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          # 设置执行权限
          chmod +x scripts/deploy-server.sh
          
          # 执行部署脚本
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type || 'docker' }}"
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild || 'false' }}"
          
          echo "部署类型: $DEPLOY_TYPE"
          echo "强制重建: $FORCE_REBUILD"
          
          ./scripts/deploy-server.sh $DEPLOY_TYPE $FORCE_REBUILD
          
          echo "✅ 部署完成"

  # ===== 健康检查 =====
  health-check:
    name: 🏥 健康检查
    runs-on: ubuntu-latest
    needs: deploy-application
    timeout-minutes: 10
    steps:
    - name: 等待服务启动
      run: |
        echo "⏳ 等待服务启动..."
        sleep 30
    
    - name: 基础连接测试
      run: |
        echo "🔍 测试服务器连接..."
        
        # 测试SSH连接
        if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "echo 'SSH连接正常'" > /dev/null 2>&1; then
          echo "✅ SSH连接正常"
        else
          echo "❌ SSH连接失败"
          exit 1
        fi
    
    - name: 服务状态检查
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ env.SERVER_HOST }}
        username: ${{ env.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ env.SERVER_PORT }}
        script: |
          echo "🔍 检查服务状态..."
          
          # 检查Docker服务
          if command -v docker &> /dev/null; then
            echo "Docker服务状态:"
            docker ps
            echo ""
          fi
          
          # 检查端口监听
          echo "端口监听状态:"
          netstat -tlnp | grep -E ":(80|443|8000|5432|6379)" || echo "没有相关端口监听"
          echo ""
          
          # 检查进程
          echo "相关进程:"
          ps aux | grep -E "(gunicorn|nginx|postgres|redis)" | grep -v grep || echo "没有相关进程"
          echo ""
          
          # 检查磁盘空间
          echo "磁盘使用情况:"
          df -h
          echo ""
          
          # 检查内存使用
          echo "内存使用情况:"
          free -h
          echo ""
    
    - name: 应用功能测试
      run: |
        echo "🧪 测试应用功能..."
        
        # 测试端点列表
        endpoints=(
          "http://${{ env.SERVER_HOST }}:8000/"
          "http://${{ env.SERVER_HOST }}:8000/health/"
          "http://${{ env.SERVER_HOST }}:8000/admin/"
          "https://${{ env.DOMAIN }}/"
          "https://${{ env.DOMAIN }}/health/"
        )
        
        # 测试函数
        test_endpoint() {
          local url=$1
          local name=$2
          echo "🔍 测试: $name ($url)"
          
          # 尝试访问
          if curl -f -L --connect-timeout 15 --max-time 30 "$url" > /dev/null 2>&1; then
            echo "✅ $name 访问成功"
            return 0
          else
            echo "❌ $name 访问失败"
            # 获取详细错误信息
            status_code=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 15 --max-time 30 "$url" 2>/dev/null || echo "000")
            echo "HTTP状态码: $status_code"
            return 1
          fi
        }
        
        # 执行测试
        success_count=0
        total_count=${#endpoints[@]}
        
        for endpoint in "${endpoints[@]}"; do
          if test_endpoint "$endpoint" "端点"; then
            ((success_count++))
          fi
        done
        
        # 输出测试结果
        echo "📊 测试结果: $success_count/$total_count 成功"
        
        # 如果所有测试都失败，退出
        if [ $success_count -eq 0 ]; then
          echo "❌ 所有测试都失败，部署可能有问题"
          exit 1
        fi
        
        echo "✅ 应用功能测试完成"

  # ===== 通知 =====
  notification:
    name: 📧 部署通知
    runs-on: ubuntu-latest
    needs: [deploy-application, health-check]
    if: always()
    timeout-minutes: 5
    steps:
    - name: 准备通知数据
      id: prepare
      run: |
        # 收集作业状态
        DEPLOY_STATUS="${{ needs.deploy-application.result || 'skipped' }}"
        HEALTH_STATUS="${{ needs.health-check.result || 'skipped' }}"
        
        # 确定整体状态
        if [[ "$DEPLOY_STATUS" == "success" && "$HEALTH_STATUS" == "success" ]]; then
          OVERALL_STATUS="SUCCESS"
          STATUS_ICON="✅"
          STATUS_COLOR="green"
        elif [[ "$DEPLOY_STATUS" == "success" ]]; then
          OVERALL_STATUS="DEPLOY_SUCCESS"
          STATUS_ICON="🚀✅"
          STATUS_COLOR="yellow"
        elif [[ "$DEPLOY_STATUS" == "failure" ]]; then
          OVERALL_STATUS="DEPLOY_FAILED"
          STATUS_ICON="❌"
          STATUS_COLOR="red"
        else
          OVERALL_STATUS="SKIPPED"
          STATUS_ICON="⏭️"
          STATUS_COLOR="gray"
        fi
        
        echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
        echo "status_icon=$STATUS_ICON" >> $GITHUB_OUTPUT
        echo "status_color=$STATUS_COLOR" >> $GITHUB_OUTPUT
        echo "deploy_status=$DEPLOY_STATUS" >> $GITHUB_OUTPUT
        echo "health_status=$HEALTH_STATUS" >> $GITHUB_OUTPUT
    
    - name: 发送邮件通知
      if: env.NOTIFICATION_EMAIL != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🚀 ModeShift Django 部署结果 - ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}"
        to: ${{ env.NOTIFICATION_EMAIL }}
        from: ${{ secrets.EMAIL_USERNAME || 'noreply@modeshift.com' }}
        body: |
          🚀 ModeShift Django 生产环境部署结果
          
          整体状态: ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}
          
          📊 各阶段状态:
          - 部署应用: ${{ steps.prepare.outputs.deploy_status }}
          - 健康检查: ${{ steps.prepare.outputs.health_status }}
          
          🌐 访问地址:
          - 服务器直连: http://${{ env.SERVER_HOST }}:8000
          - 域名访问: https://${{ env.DOMAIN }}
          - 健康检查: https://${{ env.DOMAIN }}/health/
          - 管理后台: https://${{ env.DOMAIN }}/admin/
          
          📝 部署信息:
          - 提交SHA: ${{ github.sha }}
          - 分支: ${{ github.ref_name }}
          - 触发者: ${{ github.actor }}
          - 时间: $(date)
          - 部署方式: ${{ github.event.inputs.deploy_type || 'docker' }}
          
          👤 管理员账号: admin/admin123
          
          ---
          此邮件由 GitHub Actions 自动发送
    
    - name: 输出总结
      run: |
        echo "## 🎯 生产环境部署总结" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**整体状态**: ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 各阶段状态" >> $GITHUB_STEP_SUMMARY
        echo "- **部署应用**: ${{ steps.prepare.outputs.deploy_status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **健康检查**: ${{ steps.prepare.outputs.health_status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 访问地址" >> $GITHUB_STEP_SUMMARY
        echo "- **服务器直连**: http://${{ env.SERVER_HOST }}:8000" >> $GITHUB_STEP_SUMMARY
        echo "- **域名访问**: https://${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
        echo "- **健康检查**: https://${{ env.DOMAIN }}/health/" >> $GITHUB_STEP_SUMMARY
        echo "- **管理后台**: https://${{ env.DOMAIN }}/admin/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📝 部署信息" >> $GITHUB_STEP_SUMMARY
        echo "- **提交SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **部署方式**: ${{ github.event.inputs.deploy_type || 'docker' }}" >> $GITHUB_STEP_SUMMARY
