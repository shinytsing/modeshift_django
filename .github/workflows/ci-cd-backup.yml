name: 🚀 一键部署 + 线上测试 + 邮件通知

# 极简CI/CD流程：一键部署 → 线上测试 → 邮件通知
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  NOTIFICATION_EMAIL: "1009383129@qq.com"
  PYTHON_VERSION: '3.11'
  DEPLOY_TIMEOUT: 300  # 5分钟部署超时

jobs:
  # ===== 一键部署 =====
  one-click-deploy:
    name: 🚀 一键部署
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 10
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 检查SSH连接
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "✅ SSH连接成功！"
          echo "服务器信息:"
          echo "主机名: $(hostname)"
          echo "用户: $(whoami)"
          echo "当前目录: $(pwd)"
          echo "系统信息: $(uname -a)"
    
    - name: 执行一键部署
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script_stop: true
        timeout: 300s
        command_timeout: 60s
        script: |
          echo "🚀 开始一键部署..."
          
          # 设置错误处理
          set -e
          set -o pipefail
          
          # 启用调试模式
          set -x
          
          # 0. 环境检查
          echo "🔍 环境检查..."
          echo "当前用户: $(whoami)"
          echo "当前目录: $(pwd)"
          echo "系统信息: $(uname -a)"
          echo "Python版本: $(python3 --version)"
          echo "Git版本: $(git --version)"
          
          # 1. 进入项目目录
          PROJECT_DIR="$HOME/modeshift_django"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "📁 创建项目目录..."
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"
            git clone https://github.com/shinytsing/modeshift_django.git .
          else
            echo "📁 进入项目目录..."
            cd "$PROJECT_DIR"
          fi
          
          # 2. 拉取最新代码
          echo "📥 拉取最新代码..."
          git fetch origin
          git checkout main
          git reset --hard origin/main
          
          # 3. 设置虚拟环境
          echo "🐍 设置Python环境..."
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          
          # 4. 安装依赖
          echo "📦 安装依赖..."
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install django-environ gunicorn
          
          # 5. 启动服务
          echo "🔧 启动服务..."
          # 尝试启动PostgreSQL
          if command -v systemctl &> /dev/null; then
            systemctl start postgresql || echo "PostgreSQL启动失败，继续执行"
            systemctl start redis-server || echo "Redis启动失败，继续执行"
          else
            echo "systemctl不可用，跳过服务启动"
          fi
          
          # 6. 配置数据库
          echo "🗄️ 配置数据库..."
          sudo -u postgres psql -c "CREATE USER qatoolbox WITH PASSWORD 'qatoolbox123';" 2>/dev/null || echo "用户已存在"
          sudo -u postgres psql -c "CREATE DATABASE qatoolbox_production OWNER qatoolbox;" 2>/dev/null || echo "数据库已存在"
          
          # 7. 创建环境配置
          echo "⚙️ 创建环境配置..."
          cat > .env << 'EOF'
          DEBUG=False
          DJANGO_SECRET_KEY=django-production-secret-key-change-me-123456789
          DJANGO_SETTINGS_MODULE=config.settings.production
          DB_NAME=qatoolbox_production
          DB_USER=qatoolbox
          DB_PASSWORD=qatoolbox123
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DEEPSEEK_API_KEY=sk-c4a84c8bbff341cbb3006ecaf84030fe
          ALLOWED_HOSTS=47.103.143.152,shenyiqing.xin,www.shenyiqing.xin,localhost,127.0.0.1,0.0.0.0
          SECURE_SSL_REDIRECT=False
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_HOST_USER=your-email@gmail.com
          EMAIL_HOST_PASSWORD=your-email-password
          DEFAULT_FROM_EMAIL=noreply@shenyiqing.xin
          EOF
          
          # 8. Django操作
          echo "🔧 Django配置..."
          python manage.py check --settings=config.settings.production
          python manage.py migrate --noinput --settings=config.settings.production
          python manage.py collectstatic --noinput --settings=config.settings.production
          
          # 9. 创建超级用户
          echo "👤 创建超级用户..."
          python manage.py shell --settings=config.settings.production << 'EOF' || echo "超级用户创建失败，继续执行"
          from django.contrib.auth import get_user_model
          User = get_user_model()
          if not User.objects.filter(username='admin').exists():
              User.objects.create_superuser('admin', 'admin@example.com', 'admin123')
              print('超级用户创建成功: admin/admin123')
          else:
              print('超级用户已存在')
          EOF
          
          # 10. 重启服务
          echo "🔄 重启服务..."
          pkill -f gunicorn || echo "没有运行中的gunicorn进程"
          sleep 2
          export DJANGO_SETTINGS_MODULE=config.settings.production
          gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 wsgi:application --daemon
          
          # 11. 等待服务启动
          echo "⏳ 等待服务启动..."
          sleep 15
          
          # 12. 检查服务状态
          echo "🔍 检查服务状态..."
          ps aux | grep gunicorn | grep -v grep
          netstat -tlnp | grep 8000
          
          echo "✅ 部署完成！"
          echo "🌐 访问地址: http://47.103.143.152:8000"
          echo "👤 管理员账号: admin/admin123"

  # ===== 线上测试 =====
  online-test:
    name: 🧪 线上测试
    runs-on: ubuntu-latest
    needs: one-click-deploy
    if: always() && needs.one-click-deploy.result == 'success'
    timeout-minutes: 5
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 安装测试依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest
    
    - name: 运行线上测试
      run: |
        echo "🧪 开始线上测试..."
        
        # 测试端点列表
        endpoints=(
          "http://47.103.143.152:8000/health/"
          "http://47.103.143.152:8000/"
          "https://shenyiqing.xin/"
          "https://shenyiqing.xin/health/"
        )
        
        # 测试函数
        test_endpoint() {
          local url=$1
          local name=$2
          echo "🔍 测试: $name ($url)"
          
          # 尝试访问
          if curl -f -L --connect-timeout 10 --max-time 30 "$url" > /dev/null 2>&1; then
            echo "✅ $name 访问成功"
            return 0
          else
            echo "❌ $name 访问失败"
            # 获取详细错误信息
            curl -v -L --connect-timeout 10 --max-time 30 "$url" 2>&1 | head -10
            return 1
          fi
        }
        
        # 执行测试
        success_count=0
        total_count=${#endpoints[@]}
        
        for endpoint in "${endpoints[@]}"; do
          if test_endpoint "$endpoint" "端点"; then
            ((success_count++))
          fi
        done
        
        # 输出测试结果
        echo "📊 测试结果: $success_count/$total_count 成功"
        
        # 检查HTTP状态码
        echo "📈 HTTP状态码检查..."
        for endpoint in "${endpoints[@]}"; do
          status_code=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 30 "$endpoint" 2>/dev/null || echo "000")
          echo "$endpoint: HTTP $status_code"
        done
        
        # 如果所有测试都失败，退出
        if [ $success_count -eq 0 ]; then
          echo "❌ 所有测试都失败，部署可能有问题"
          exit 1
        fi
        
        echo "✅ 线上测试完成"

  # ===== 邮件通知 =====
  notification:
    name: 📧 邮件通知
    runs-on: ubuntu-latest
    needs: [one-click-deploy, online-test]
    if: always()
    timeout-minutes: 2
    steps:
    - name: 准备通知数据
      id: prepare
      run: |
        # 收集作业状态
        DEPLOY_STATUS="${{ needs.one-click-deploy.result || 'skipped' }}"
        TEST_STATUS="${{ needs.online-test.result || 'skipped' }}"
        
        # 确定整体状态
        if [[ "$DEPLOY_STATUS" == "success" && "$TEST_STATUS" == "success" ]]; then
          OVERALL_STATUS="SUCCESS"
          STATUS_ICON="✅"
          STATUS_COLOR="green"
        elif [[ "$DEPLOY_STATUS" == "success" ]]; then
          OVERALL_STATUS="DEPLOY_SUCCESS"
          STATUS_ICON="🚀✅"
          STATUS_COLOR="yellow"
        elif [[ "$DEPLOY_STATUS" == "failure" ]]; then
          OVERALL_STATUS="DEPLOY_FAILED"
          STATUS_ICON="❌"
          STATUS_COLOR="red"
        else
          OVERALL_STATUS="SKIPPED"
          STATUS_ICON="⏭️"
          STATUS_COLOR="gray"
        fi
        
        echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
        echo "status_icon=$STATUS_ICON" >> $GITHUB_OUTPUT
        echo "status_color=$STATUS_COLOR" >> $GITHUB_OUTPUT
        echo "deploy_status=$DEPLOY_STATUS" >> $GITHUB_OUTPUT
        echo "test_status=$TEST_STATUS" >> $GITHUB_OUTPUT
    
    - name: 发送邮件通知
      if: env.NOTIFICATION_EMAIL != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🚀 ModeShift Django 部署结果 - ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}"
        to: ${{ env.NOTIFICATION_EMAIL }}
        from: ${{ secrets.EMAIL_USERNAME || 'noreply@modeshift.com' }}
        body: |
          🚀 ModeShift Django 一键部署结果
          
          整体状态: ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}
          
          📊 各阶段状态:
          - 一键部署: ${{ steps.prepare.outputs.deploy_status }}
          - 线上测试: ${{ steps.prepare.outputs.test_status }}
          
          🌐 访问地址:
          - 生产环境: http://47.103.143.152:8000
          - 健康检查: http://47.103.143.152:8000/health/
          - 域名访问: https://shenyiqing.xin
          
          📝 部署信息:
          - 提交SHA: ${{ github.sha }}
          - 分支: ${{ github.ref_name }}
          - 触发者: ${{ github.actor }}
          - 时间: $(date)
          - 环境: ${{ github.event.inputs.environment || 'production' }}
          
          👤 管理员账号: admin/admin123
          
          ---
          此邮件由 GitHub Actions 自动发送
    
    - name: 输出总结
      run: |
        echo "## 🎯 一键部署总结" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**整体状态**: ${{ steps.prepare.outputs.overall_status }} ${{ steps.prepare.outputs.status_icon }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 各阶段状态" >> $GITHUB_STEP_SUMMARY
        echo "- **一键部署**: ${{ steps.prepare.outputs.deploy_status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **线上测试**: ${{ steps.prepare.outputs.test_status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 访问地址" >> $GITHUB_STEP_SUMMARY
        echo "- **生产环境**: http://47.103.143.152:8000" >> $GITHUB_STEP_SUMMARY
        echo "- **健康检查**: http://47.103.143.152:8000/health/" >> $GITHUB_STEP_SUMMARY
        echo "- **域名访问**: https://shenyiqing.xin" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📝 部署信息" >> $GITHUB_STEP_SUMMARY
        echo "- **提交SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **环境**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY