name: 健壮部署工作流

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行测试
      run: |
        python manage.py test --verbosity=2
        
    - name: 代码质量检查
      run: |
        # 安装代码质量工具
        pip install flake8 black isort mypy bandit safety
        
        # 代码格式检查
        black --check .
        isort --check-only .
        
        # 代码风格检查
        flake8 .
        
        # 类型检查
        mypy .
        
        # 安全扫描
        bandit -r . -f json -o bandit-report.json
        safety check --json --output safety-report.json
        
    - name: 部署到服务器
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 进入项目目录
          cd /opt/modeshift_django
          
          # 检查网络连接
          echo "🔍 检查网络连接..."
          if ! ping -c 1 8.8.8.8 > /dev/null 2>&1; then
            echo "❌ 基本网络连接失败"
            exit 1
          fi
          
          # 尝试更新代码
          echo "📥 尝试更新代码..."
          if curl -I --connect-timeout 10 https://github.com > /dev/null 2>&1; then
            echo "✅ GitHub连接正常，拉取最新代码"
            git pull origin main || echo "⚠️ Git拉取失败，使用本地代码"
          else
            echo "⚠️ GitHub连接失败，使用本地代码"
          fi
          
          # 停止现有服务
          echo "🛑 停止现有服务..."
          pkill -TERM -f gunicorn || true
          sleep 3
          pkill -9 -f gunicorn || true
          sleep 2
          
          # 设置虚拟环境
          echo "🐍 设置虚拟环境..."
          if [ ! -d 'venv' ]; then
            python3 -m venv venv
          fi
          venv/bin/python -m pip install --upgrade pip --quiet
          venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
          
          # Django操作
          echo "📁 Django操作..."
          venv/bin/python manage.py collectstatic --noinput --clear
          venv/bin/python manage.py migrate --noinput
          
          # 启动服务
          echo "🚀 启动服务..."
          mkdir -p logs
          nohup venv/bin/gunicorn \
            --bind 0.0.0.0:8000 \
            --workers 3 \
            --timeout 120 \
            --max-requests 1000 \
            --max-requests-jitter 100 \
            --preload \
            --access-logfile logs/gunicorn_access.log \
            --error-logfile logs/gunicorn_error.log \
            wsgi:application \
            --daemon
          
          # 等待服务启动
          echo "⏳ 等待服务启动..."
          sleep 10
          
          # 验证服务状态
          echo "🔍 验证服务状态..."
          if ! pgrep -f gunicorn > /dev/null; then
            echo "❌ gunicorn启动失败"
            exit 1
          fi
          
          # 健康检查
          echo "🏥 健康检查..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health/ > /dev/null 2>&1; then
              echo "✅ 本地健康检查通过"
              break
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ 本地健康检查失败"
              echo "查看错误日志:"
              tail -20 logs/gunicorn_error.log || true
              exit 1
            fi
            
            sleep 5
          done
          
          # 重载nginx
          echo "🔄 重载nginx..."
          sudo nginx -s reload || echo "⚠️ nginx重载失败"
          
          # 外部健康检查
          echo "🌐 外部健康检查..."
          sleep 5
          for i in {1..5}; do
            if curl -f http://47.103.143.152/health/ > /dev/null 2>&1; then
              echo "✅ 外部健康检查通过"
              break
            fi
            
            if [ $i -eq 5 ]; then
              echo "⚠️ 外部健康检查失败，但本地服务正常"
            fi
            
            sleep 5
          done
          
          echo "🎉 部署完成！"
          echo "🌐 访问地址: https://shenyiqing.xin"
          echo "👤 管理员账号: admin / admin123"
          
    - name: 部署后测试
      run: |
        echo "🔍 开始部署后测试..."
        
        # 等待服务完全启动
        sleep 30
        
        # 测试首页
        echo "📊 测试首页..."
        if curl -f -L https://shenyiqing.xin/ > /dev/null 2>&1; then
          echo "✅ 首页测试通过"
        else
          echo "❌ 首页测试失败"
          exit 1
        fi
        
        # 测试健康检查
        echo "🏥 测试健康检查..."
        if curl -f -L https://shenyiqing.xin/health/ > /dev/null 2>&1; then
          echo "✅ 健康检查测试通过"
        else
          echo "❌ 健康检查测试失败"
          exit 1
        fi
        
        # 测试API接口
        echo "🔌 测试API接口..."
        if curl -f -L https://shenyiqing.xin/api/health/ > /dev/null 2>&1; then
          echo "✅ API接口测试通过"
        else
          echo "⚠️ API接口测试失败（可能不存在）"
        fi
        
        echo "🎉 所有测试完成！"
        
    - name: 通知部署结果
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ 部署成功！"
          echo "🌐 访问地址: https://shenyiqing.xin"
        else
          echo "❌ 部署失败！"
          echo "请检查日志并手动修复问题"
        fi
