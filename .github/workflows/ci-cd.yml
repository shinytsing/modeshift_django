name: 🚀 一键部署

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: 🚀 部署到阿里云
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ 检出代码
      uses: actions/checkout@v4
    
    - name: 🚀 部署到服务器
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🚀 开始部署到阿里云服务器..."
        
        # 检查必要的环境变量
        if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
          echo "❌ 缺少必要的GitHub Secrets配置"
          echo "请确保设置了以下Secrets:"
          echo "- SERVER_HOST: 47.103.143.152"
          echo "- SERVER_USER: root"
          echo "- SERVER_SSH_KEY: SSH私钥"
          echo "- DEPLOY_PATH: /root/modeshift_django"
          exit 1
        fi
        
        echo "✅ 环境变量检查通过"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        echo "🔑 添加SSH主机密钥..."
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        echo "🔗 测试SSH连接..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $USERNAME@$HOST "echo 'SSH连接成功'"
        
        echo "📦 开始部署..."
        ssh -o StrictHostKeyChecking=no $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '📥 拉取最新代码...' &&
          git pull origin main &&
          echo '🐍 激活虚拟环境...' &&
          source venv/bin/activate &&
          echo '📦 安装依赖...' &&
          pip install -r requirements.txt &&
          echo '📁 收集静态文件...' &&
          python manage.py collectstatic --noinput &&
          echo '🗄️ 运行数据库迁移...' &&
          python manage.py migrate &&
          echo '🔄 重启服务...' &&
          sudo systemctl restart gunicorn &&
          sudo systemctl restart nginx &&
          echo '✅ 部署完成'
        "
        
        echo "🎉 部署成功完成！"
        echo "🌐 网站地址: https://shenyinqing.xin"