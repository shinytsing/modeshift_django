name: 🚀 部署 + 线上测试

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: 🚀 部署到服务器
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ 检出代码
      uses: actions/checkout@v4
    
    - name: 🚀 部署到服务器
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🚀 开始部署..."
        
        # 检查必要的环境变量
        if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
          echo "❌ 缺少必要的GitHub Secrets配置"
          echo "请确保设置了以下Secrets:"
          echo "- SERVER_HOST: 47.103.143.152"
          echo "- SERVER_USER: root"
          echo "- SERVER_SSH_KEY: SSH私钥"
          echo "- DEPLOY_PATH: /root/modeshift_django"
          echo "- WEB_URL: https://shenyinqing.xin"
          echo "- API_URL: https://shenyinqing.xin"
          exit 1
        fi
        
        echo "✅ 环境变量检查通过"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        
        echo "🔍 检查SSH密钥格式..."
        if ! ssh-keygen -l -f ~/.ssh/id_rsa > /dev/null 2>&1; then
          echo "❌ SSH私钥格式错误"
          echo "请检查SERVER_SSH_KEY的内容是否正确"
          exit 1
        fi
        echo "✅ SSH密钥格式正确"
        
        echo "🔑 添加SSH主机密钥..."
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        echo "🔗 测试SSH连接..."
        echo "调试信息："
        echo "- HOST: $HOST"
        echo "- USERNAME: $USERNAME"
        echo "- SSH密钥长度: ${#SSH_KEY} 字符"
        echo "- SSH密钥开头: ${SSH_KEY:0:50}..."
        
        # 详细SSH连接测试
        ssh -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o PasswordAuthentication=no $USERNAME@$HOST "echo 'SSH连接成功'" 2>&1 | head -20 || {
          echo "❌ SSH连接失败"
          echo "详细错误信息："
          ssh -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o PasswordAuthentication=no $USERNAME@$HOST "echo 'SSH连接成功'" 2>&1 | tail -10
          echo ""
          echo "请检查："
          echo "1. GitHub Secrets中的SERVER_SSH_KEY是否正确"
          echo "2. 公钥已添加到服务器的 ~/.ssh/authorized_keys"
          echo "3. 服务器SSH服务正常运行"
          exit 1
        }
        
        echo "📦 开始部署..."
        
        echo "📥 拉取最新代码..."
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o ConnectTimeout=30 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '配置Git网络设置...' &&
          git config --global http.sslVerify false &&
          git config --global http.postBuffer 1048576000 &&
          git config --global http.lowSpeedLimit 1000 &&
          git config --global http.lowSpeedTime 300 &&
          git config --global http.version HTTP/1.1 &&
          git config --global core.compression 0 &&
          git config --global http.keepAlive false &&
          echo '清理工作目录...' &&
          git clean -fd &&
          git reset --hard HEAD &&
          echo '拉取最新代码...' &&
          git pull origin main || {
            echo 'Git pull失败，尝试重新配置...' &&
            git config --global http.sslVerify false &&
            git config --global http.postBuffer 2097152000 &&
            git pull origin main
          }
        "
        
        echo "🐍 优化虚拟环境管理..."
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 -o TCPKeepAlive=yes $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '检查虚拟环境状态...' &&
          if [ -d 'venv' ] && [ -f 'venv/pyvenv.cfg' ]; then
            echo '虚拟环境已存在，检查依赖...' &&
            source venv/bin/activate &&
            echo '检查requirements.txt是否有变化...' &&
            if [ requirements.txt -nt venv/pyvenv.cfg ]; then
              echo '依赖有变化，更新虚拟环境...' &&
              pip install --upgrade pip --quiet &&
              pip install -r requirements.txt --no-cache-dir --quiet
            else
              echo '依赖无变化，跳过安装'
            fi
          else
            echo '创建新虚拟环境...' &&
            python3 -m venv venv &&
            source venv/bin/activate &&
            pip install --upgrade pip --quiet &&
            pip install -r requirements.txt --no-cache-dir --quiet
          fi
        " || {
          echo "❌ 虚拟环境管理失败，强制重建..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 -o TCPKeepAlive=yes $USERNAME@$HOST "
            cd $DEPLOY_PATH &&
            pkill -f python || true &&
            pkill -f gunicorn || true &&
            rm -rf venv &&
            python3 -m venv venv &&
            source venv/bin/activate &&
            pip install --upgrade pip --quiet &&
            pip install -r requirements.txt --no-cache-dir --quiet
          "
        }
        
        echo "📁 优化Django操作..."
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 -o TCPKeepAlive=yes $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          source venv/bin/activate &&
          echo '检查静态文件变化...' &&
          python manage.py collectstatic --noinput --clear &&
          echo '检查数据库迁移...' &&
          python manage.py migrate --noinput
        "
        
        echo "🔄 快速重启服务..."
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 -o TCPKeepAlive=yes $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          source venv/bin/activate &&
          echo '优雅停止gunicorn...' &&
          pkill -TERM -f gunicorn || true &&
          sleep 2 &&
          echo '启动gunicorn服务...' &&
          nohup gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 100 wsgi:application --daemon &&
          echo '重载nginx配置...' &&
          sudo nginx -s reload &&
          echo '验证服务状态...' &&
          sleep 3 &&
          ps aux | grep gunicorn | grep -v grep | head -1 &&
          curl -f -s http://localhost:8000/health/ > /dev/null && echo '✅ 服务健康检查通过' || echo '⚠️ 服务启动中...'
        "
        
        echo "✅ 部署完成"
        
        echo "🎉 部署成功完成！"

  online-test:
    name: ✅ 线上测试
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: 🌐 网页检查
      run: |
        echo "🌐 检查网页访问..."
        
        # 检查必要的环境变量
        WEB_URL="${{ secrets.WEB_URL }}"
        if [ -z "$WEB_URL" ]; then
          echo "❌ 缺少WEB_URL配置"
          echo "请在GitHub Secrets中设置WEB_URL（如：https://shenyinqing.xin）"
          exit 1
        fi
        
        echo "✅ 使用网站URL: $WEB_URL"
        
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 10
        
        echo "🔍 开始网页检查..."
        
        # 检查首页
        echo "检查首页..."
        if curl -f -s --max-time 10 "$WEB_URL/" > /dev/null; then
          echo "✅ 首页访问正常"
        else
          echo "❌ 首页访问失败"
        fi
        
        # 检查静态文件
        echo "检查静态文件..."
        if curl -f -s --max-time 10 "$WEB_URL/static/" > /dev/null; then
          echo "✅ 静态文件正常"
        else
          echo "❌ 静态文件失败"
        fi
        
        # 检查管理后台
        echo "检查管理后台..."
        if curl -f -s --max-time 10 "$WEB_URL/admin/" > /dev/null; then
          echo "✅ 管理后台正常"
        else
          echo "❌ 管理后台失败"
        fi
    
    - name: 🔌 API测试
      run: |
        echo "🔌 检查API接口..."
        
        # 检查必要的环境变量
        API_URL="${{ secrets.API_URL }}"
        if [ -z "$API_URL" ]; then
          echo "❌ 缺少API_URL配置"
          echo "请在GitHub Secrets中设置API_URL（如：https://shenyinqing.xin）"
          exit 1
        fi
        
        echo "✅ 使用API URL: $API_URL"
        
        echo "🔍 开始API检查..."
        
        # 检查API根路径
        echo "检查API根路径..."
        if curl -f -s --max-time 10 "$API_URL/api/" > /dev/null; then
          echo "✅ API根路径正常"
        else
          echo "❌ API根路径失败"
        fi
        
        # 检查健康检查端点
        echo "检查健康检查端点..."
        if curl -f -s --max-time 10 "$API_URL/health/" > /dev/null; then
          echo "✅ 健康检查正常"
        else
          echo "❌ 健康检查失败"
        fi
        
        # 检查用户API
        echo "检查用户API..."
        if curl -f -s --max-time 10 "$API_URL/api/users/" > /dev/null; then
          echo "✅ 用户API正常"
        else
          echo "❌ 用户API失败"
        fi
        
        # 检查工具API
        echo "检查工具API..."
        if curl -f -s --max-time 10 "$API_URL/api/tools/" > /dev/null; then
          echo "✅ 工具API正常"
        else
          echo "❌ 工具API失败"
        fi
        
        echo "✅ 线上测试完成"
        echo "🌐 网站地址: https://shenyinqing.xin"