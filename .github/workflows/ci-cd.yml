name: 🚀 极简CI/CD流程

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: 🚀 一键部署
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4
      
    - name: 🐍 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 安装依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🚀 部署到服务器
      env:
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🚀 开始部署..."
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        # 部署脚本
        ssh -o StrictHostKeyChecking=no $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          git pull origin main &&
          source venv/bin/activate &&
          pip install -r requirements.txt &&
          python manage.py collectstatic --noinput &&
          python manage.py migrate &&
          sudo systemctl restart gunicorn &&
          sudo systemctl restart nginx
        "
        
        echo "✅ 部署完成"

  online-test:
    name: ✅ 线上测试
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: 🌐 网页检查
      run: |
        echo "🌐 检查网页访问..."
        
        # 等待服务启动
        sleep 30
        
        # 检查网页
        WEB_URL="${{ secrets.WEB_URL }}"
        
        echo "检查首页..."
        curl -f "$WEB_URL/" && echo "✅ 首页访问正常" || echo "❌ 首页访问失败"
        
        echo "检查静态文件..."
        curl -f "$WEB_URL/static/" && echo "✅ 静态文件正常" || echo "❌ 静态文件失败"
        
        echo "检查管理后台..."
        curl -f "$WEB_URL/admin/" && echo "✅ 管理后台正常" || echo "❌ 管理后台失败"
    
    - name: 🔌 API测试
      run: |
        echo "🔌 检查API接口..."
        
        # 检查API端点
        API_URL="${{ secrets.API_URL }}"
        
        echo "检查API根路径..."
        curl -f "$API_URL/api/" && echo "✅ API根路径正常" || echo "❌ API根路径失败"
        
        echo "检查健康检查端点..."
        curl -f "$API_URL/health/" && echo "✅ 健康检查正常" || echo "❌ 健康检查失败"
        
        echo "检查用户API..."
        curl -f "$API_URL/api/users/" && echo "✅ 用户API正常" || echo "❌ 用户API失败"
        
        echo "检查工具API..."
        curl -f "$API_URL/api/tools/" && echo "✅ 工具API正常" || echo "❌ 工具API失败"
        
        echo "✅ 线上测试完成"