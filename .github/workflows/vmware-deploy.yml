name: Deploy to VMware Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vmware-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: QA gate — API contracts and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            qa/requirements.txt

      - name: Set up Node for Allure rendering
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install application and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r qa/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Check formatting for changed Python files
        shell: bash
        run: |
          base_sha="${{ github.event.before }}"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="${{ github.sha }}^"
          fi
          changed_python_files=$(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.py')
          if [ -z "$changed_python_files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          printf '%s\n' "$changed_python_files" | xargs python -m black --check

      - name: Run the shared local and CI QA command
        run: python qa/scripts/run_suite.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-evidence
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Build and start Docker application on VMware
    needs: qa
    runs-on: [self-hosted, linux, x64, vmware]
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QATOOLBOX_BUILD_LOCAL: "true"
      QATOOLBOX_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz

    steps:
      - name: Download the triggering revision and build locally
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="${QATOOLBOX_DIR:-$HOME/modeshift_django}"
          mkdir -p "$deploy_dir/scripts"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/deploy-vm.sh" \
            -o "$deploy_dir/scripts/deploy-vm.sh"
          chmod +x "$deploy_dir/scripts/deploy-vm.sh"
          QATOOLBOX_DIR="$deploy_dir" bash "$deploy_dir/scripts/deploy-vm.sh"

      - name: Verify deployed health contract
        run: curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/health/

  notify:
    name: Email final pipeline result
    needs: [qa, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      QA_RESULT: ${{ needs.qa.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send final pipeline result
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          required = (
              "EMAIL_HOST", "EMAIL_PORT", "EMAIL_HOST_USER", "EMAIL_HOST_PASSWORD",
              "DEFAULT_FROM_EMAIL", "NOTIFICATION_EMAIL",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError("Missing GitHub Actions secrets: " + ", ".join(missing))

          results = {
              "质量门禁（格式化、API、UI）": os.environ["QA_RESULT"],
              "VM本地构建、部署与健康检查": os.environ["DEPLOY_RESULT"],
          }
          succeeded = all(value == "success" for value in results.values())
          label = "成功" if succeeded else "失败"
          message = EmailMessage()
          message["Subject"] = f"[{label}] QAToolBox 发布流水线 {os.environ['SOURCE_SHA'][:7]}"
          message["From"] = os.environ["DEFAULT_FROM_EMAIL"]
          message["To"] = os.environ["NOTIFICATION_EMAIL"]
          result_lines = "\n".join(f"- {name}：{result}" for name, result in results.items())
          message.set_content(
              f"发布流水线结果：{label}\n"
              f"仓库：{os.environ['SOURCE_REPOSITORY']}\n"
              f"提交：{os.environ['SOURCE_SHA']}\n\n"
              f"阶段结果：\n{result_lines}\n\n"
              f"详情：{os.environ['SOURCE_URL']}\n"
          )
          with smtplib.SMTP(os.environ["EMAIL_HOST"], int(os.environ["EMAIL_PORT"]), timeout=30) as server:
              if os.environ.get("EMAIL_USE_TLS", "true").lower() in {"1", "true", "yes"}:
                  server.starttls()
              server.login(os.environ["EMAIL_HOST_USER"], os.environ["EMAIL_HOST_PASSWORD"])
              server.send_message(message)
          PY
