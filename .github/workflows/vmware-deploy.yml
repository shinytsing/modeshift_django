name: Deploy to VMware Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vmware-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_image:
    name: Build and publish cached production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Set image reference
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ghcr.io/${{ github.repository }}:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=qatoolbox-production
          cache-to: type=gha,mode=max,scope=qatoolbox-production

  deploy:
    name: Pull and start Docker application on VMware
    needs: build_image
    runs-on: [self-hosted, linux, x64, vmware]
    # The first pull transfers OCR/AI runtime layers to a new VMware Docker
    # cache. Subsequent image updates reuse those layers and complete quickly.
    timeout-minutes: 45
    env:
      QATOOLBOX_IMAGE: ${{ needs.build_image.outputs.image }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Deploy the checked-out project
        run: bash scripts/deploy-vm.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

      - name: Verify deployed health contract
        run: |
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/health/
