name: Deploy to VMware Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vmware-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  qa:
    name: QA gate — API contracts and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            qa/requirements.txt

      - name: Set up Node for Allure rendering
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install application and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r qa/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Check formatting for changed Python files
        shell: bash
        run: |
          base_sha="${{ github.event.before }}"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="${{ github.sha }}^"
          fi
          changed_python_files=$(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.py')
          if [ -z "$changed_python_files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          printf '%s\n' "$changed_python_files" | xargs python -m black --check

      - name: Run the shared local and CI QA command
        run: python qa/scripts/run_suite.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 14

  build_image:
    name: Build and publish cached production image
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Set image reference
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ghcr.io/${{ github.repository }}:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=qatoolbox-production
          cache-to: type=gha,mode=max,scope=qatoolbox-production

  deploy:
    name: Pull and start Docker application on VMware
    needs: build_image
    runs-on: [self-hosted, linux, x64, vmware]
    # The first pull transfers OCR/AI runtime layers to a new VMware Docker
    # cache. Subsequent image updates reuse those layers and complete quickly.
    timeout-minutes: 45
    env:
      QATOOLBOX_IMAGE: ${{ needs.build_image.outputs.image }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Deploy the checked-out project
        run: bash scripts/deploy-vm.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

      - name: Verify deployed health contract
        run: |
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/health/

  notify:
    name: Email final pipeline result
    needs: [qa, build_image, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      QA_RESULT: ${{ needs.qa.result }}
      BUILD_RESULT: ${{ needs.build_image.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send final pipeline result
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          required = (
              "EMAIL_HOST", "EMAIL_PORT", "EMAIL_HOST_USER", "EMAIL_HOST_PASSWORD",
              "DEFAULT_FROM_EMAIL", "NOTIFICATION_EMAIL",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError("Missing GitHub Actions secrets: " + ", ".join(missing))

          results = {
              "质量门禁（格式化、API、UI）": os.environ["QA_RESULT"],
              "构建并推送镜像": os.environ["BUILD_RESULT"],
              "部署与健康检查": os.environ["DEPLOY_RESULT"],
          }
          succeeded = all(value == "success" for value in results.values())
          label = "成功" if succeeded else "失败"
          message = EmailMessage()
          message["Subject"] = f"[{label}] QAToolBox 发布流水线 {os.environ['SOURCE_SHA'][:7]}"
          message["From"] = os.environ["DEFAULT_FROM_EMAIL"]
          message["To"] = os.environ["NOTIFICATION_EMAIL"]
          result_lines = "\n".join(f"- {name}：{result}" for name, result in results.items())
          message.set_content(
              f"发布流水线结果：{label}\n"
              f"仓库：{os.environ['SOURCE_REPOSITORY']}\n"
              f"提交：{os.environ['SOURCE_SHA']}\n\n"
              f"阶段结果：\n{result_lines}\n\n"
              f"详情：{os.environ['SOURCE_URL']}\n"
          )
          with smtplib.SMTP(os.environ["EMAIL_HOST"], int(os.environ["EMAIL_PORT"]), timeout=30) as server:
              if os.environ.get("EMAIL_USE_TLS", "true").lower() in {"1", "true", "yes"}:
                  server.starttls()
              server.login(os.environ["EMAIL_HOST_USER"], os.environ["EMAIL_HOST_PASSWORD"])
              server.send_message(message)
          PY
