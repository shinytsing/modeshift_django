name: 🚀 自动部署

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SERVER_HOST: 47.103.143.152
  SERVER_DOMAIN: shenyiqing.xin
  SERVER_USER: root
  DEPLOY_PATH: /root/modeshift_django

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚀 部署到服务器
        run: |
          # 配置SSH
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
          
          # 执行稳定部署
          chmod +x deploy-stable.sh
          ./deploy-stable.sh

      - name: 🏥 健康检查
        run: |
          echo '🏥 执行健康检查...'
          echo '⏳ 等待服务完全启动...'
          sleep 15
          
          # 检查网站可访问性
          if curl -f -s --max-time 10 \"http://$SERVER_HOST/\" > /dev/null; then
              echo '✅ 网站访问正常'
          else
              echo '❌ 网站访问失败'
              exit 1
          fi
          
          # 检查域名访问
          if curl -f -s --max-time 10 \"http://$SERVER_DOMAIN/\" > /dev/null; then
              echo '✅ 域名访问正常'
          else
              echo '❌ 域名访问失败'
              exit 1
          fi

      - name: 📧 发送部署通知邮件
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_HOST_PASSWORD }}
          subject: |
            🚀 部署通知 - ${{ github.repository }}
            (提交: ${{ github.sha }})
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            <h2>🚀 部署通知</h2>
            
            <h3>📋 部署信息</h3>
            <ul>
              <li><strong>仓库:</strong> ${{ github.repository }}</li>
              <li><strong>分支:</strong> ${{ github.ref_name }}</li>
              <li><strong>提交:</strong> ${{ github.sha }}</li>
              <li><strong>提交者:</strong> ${{ github.actor }}</li>
              <li><strong>提交信息:</strong> ${{ github.event.head_commit.message }}</li>
              <li><strong>部署时间:</strong> ${{ github.event.head_commit.timestamp }}</li>
            </ul>
            
            <h3>🌐 访问地址</h3>
            <ul>
              <li><strong>IP访问:</strong> <a href=\"http://$SERVER_HOST\">http://$SERVER_HOST</a></li>
              <li><strong>域名访问:</strong> <a href=\"http://$SERVER_DOMAIN\">http://$SERVER_DOMAIN</a></li>
            </ul>
            
            <h3>📊 部署状态</h3>
            ${{ job.status == 'success' && '<p style=\"color: green;\">✅ <strong>部署成功</strong></p>' || '<p style=\"color: red;\">❌ <strong>部署失败</strong></p>' }}
            
            <h3>👤 管理员账号</h3>
            <ul>
              <li><strong>用户名:</strong> admin</li>
              <li><strong>密码:</strong> admin123</li>
            </ul>
            
            <hr>
            <p><small>此邮件由GitHub Actions自动发送</small></p>
          html: true

      - name: 📊 部署状态总结
        if: always()
        run: |
          if [ \"${{ job.status }}\" == \"success\" ]; then
              echo \"🎉 部署成功！\"
              echo \"🌐 访问地址:\"
              echo \"  • http://$SERVER_HOST\"
              echo \"  • http://$SERVER_DOMAIN\"
              echo \"👤 管理员账号: admin / admin123\"
              echo \"📧 通知邮件已发送\"
          else
              echo \"❌ 部署失败！\"
              echo \"请检查日志并重试\"
              echo \"📧 失败通知邮件已发送\"
          fi
