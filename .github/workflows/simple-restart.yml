name: 🚀 Git Clone 自动部署

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_DOMAIN: shenyiqing.xin
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔐 设置SSH密钥
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 📦 准备代码传输
        run: |
          echo "准备代码传输..."
          # 从 Git 已跟踪文件生成归档，避免把正在生成的压缩包再次打包。
          git archive --format=tar.gz --output="$RUNNER_TEMP/code.tar.gz" HEAD
          echo "代码压缩完成，大小: $(du -h "$RUNNER_TEMP/code.tar.gz" | cut -f1)"

      - name: 🔄 部署和重启服务
        run: |
          # 安装sshpass
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # 配置SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
          
          # 测试SSH连接
          echo "测试SSH连接..."
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "echo 'SSH连接成功'" || {
              echo "SSH连接失败，尝试使用密码认证..."
              sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "echo 'SSH密码认证成功'"
          }
          
          # 部署和重启服务
          echo "开始部署..."
          
          # 步骤1: 停止现有服务
          echo "步骤1: 停止现有服务..."
          sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=3 $SERVER_USER@$SERVER_HOST "
              echo '停止现有服务...'
              echo '当前用户: ' \$(whoami)
              echo '当前目录: ' \$(pwd)
              echo '检查Gunicorn进程...'
              ps aux | grep gunicorn | grep -v grep || echo '没有找到Gunicorn进程'
              echo '尝试停止Gunicorn...'
              # 最简单的停止方式，避免所有可能的退出码问题
              killall gunicorn 2>/dev/null; sleep 3; killall -9 gunicorn 2>/dev/null; echo 'Gunicorn停止完成'
              echo '服务停止完成'
          "
          
          # 步骤1.5: 传输代码
          echo "步骤1.5: 传输代码..."
          sshpass -p '${{ secrets.SERVER_PASSWORD }}' scp -o StrictHostKeyChecking=no "$RUNNER_TEMP/code.tar.gz" $SERVER_USER@$SERVER_HOST:/tmp/code.tar.gz
          
          # 步骤2: 部署代码和环境
          echo "步骤2: 部署代码和环境..."
          sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o ConnectTimeout=180 -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=3 $SERVER_USER@$SERVER_HOST "
              echo '备份现有代码...'
              mv '$DEPLOY_PATH' '$DEPLOY_PATH.backup.$(date +%Y%m%d_%H%M%S)' 2>/dev/null || echo '没有现有代码需要备份'
              
              echo '检查网络连接...'
              ping -c 3 github.com || echo 'GitHub连接失败'
              
              echo '解压代码...'
              mkdir -p '$DEPLOY_PATH'
              cd '$DEPLOY_PATH'
              tar -xzf /tmp/code.tar.gz
              rm /tmp/code.tar.gz
              echo '代码解压完成'
              
              echo '当前目录: ' \$(pwd)
              echo '目录内容: ' \$(ls -la)
              
              echo '创建虚拟环境...'
              python3 -m venv venv
              source venv/bin/activate
              pip install --upgrade pip
              
              echo '安装依赖...'
              pip install -r requirements.txt --break-system-packages
              
              echo '收集静态文件...'
              python manage.py collectstatic --noinput
              
              echo '检查数据库配置...'
              # 检查是否有环境变量文件
              if [ -f 'env.production' ]; then
                  echo '找到生产环境配置文件'
                  export \$(cat env.production | grep -v '^#' | xargs)
              fi
              
              # 设置环境变量
              export DJANGO_SETTINGS_MODULE=config.settings.development
              export DEBUG=True
              export ALLOWED_HOSTS=shenyiqing.xin,www.shenyiqing.xin,47.103.143.152,localhost,127.0.0.1
              
              # 数据库配置
              export DB_NAME=qatoolbox
              export DB_USER=qatoolbox
              export DB_PASSWORD=qatoolbox123
              export DB_HOST=localhost
              export DB_PORT=5432
              
              # Redis配置
              export REDIS_URL=redis://localhost:6379/0
              
              # 邮件配置
              export EMAIL_HOST=smtp.qq.com
              export EMAIL_PORT=587
              export EMAIL_HOST_USER='${{ secrets.EMAIL_HOST_USER }}'
              export EMAIL_HOST_PASSWORD='${{ secrets.EMAIL_HOST_PASSWORD }}'
              export EMAIL_USE_TLS=True
              export DEFAULT_FROM_EMAIL=noreply@shenyiqing.xin
              
              # AI和API配置
              export DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}'
              export GOOGLE_API_KEY='${{ secrets.GOOGLE_API_KEY }}'
              export OPENWEATHER_API_KEY='${{ secrets.OPENWEATHER_API_KEY }}'
              
              # 文件上传配置
              export DATA_UPLOAD_MAX_MEMORY_SIZE=104857600
              export FILE_UPLOAD_MAX_MEMORY_SIZE=104857600
              export MAX_UPLOAD_SIZE=104857600
              
              # 日志配置
              export LOG_LEVEL=INFO
              export LOG_FILE=logs/django.log
              
              # 缓存配置
              export CACHE_BACKEND=django.core.cache.backends.locmem.LocMemCache
              export CACHE_LOCATION=unique-snowflake
              
              # 会话配置
              export SESSION_ENGINE=django.contrib.sessions.backends.cache
              export SESSION_COOKIE_AGE=1209600
              
              # 静态文件配置
              export STATIC_URL=/static/
              export MEDIA_URL=/media/
              
              # CORS配置
              export CORS_ALLOWED_ORIGINS=https://shenyiqing.xin,http://shenyiqing.xin
              export CORS_ALLOW_CREDENTIALS=True
              
              # API限制配置
              export API_RATE_LIMIT_ANON=100
              export API_RATE_LIMIT_USER=1000
              
              # Celery配置
              export CELERY_BROKER_URL=django-db://
              export CELERY_RESULT_BACKEND=django-db
              export CELERY_TASK_ALWAYS_EAGER=True
              
              echo '执行数据库迁移...'
              python manage.py migrate --noinput
              
              echo '✅ 代码部署和环境配置完成'
          "
          
          # 步骤3: 启动服务
          echo "步骤3: 启动服务..."
          sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o ServerAliveInterval=5 -o ServerAliveCountMax=3 $SERVER_USER@$SERVER_HOST "
              cd '$DEPLOY_PATH'
              echo '启动Gunicorn服务...'
              chmod +x simple-start.sh; ./simple-start.sh; echo 'Gunicorn启动完成'
              echo '重启Nginx...'
              systemctl reload nginx; echo 'Nginx重启完成'
              echo '✅ 服务启动完成'
          "

      - name: 🏥 健康检查
        run: |
          echo '🏥 执行健康检查...'
          sleep 15
          
          # 健康检查 - 最多等待15分钟
          local max_attempts=180  # 15分钟 = 180次 * 5秒
          local attempt=1
          
          while [ $attempt -le $max_attempts ]; do
              echo \"健康检查尝试 $attempt/$max_attempts (最多15分钟)...\"
              
              if curl -f -s --max-time 15 \"http://$SERVER_HOST/\" > /dev/null; then
                  echo '✅ 网站访问正常'
                  break
              else
                  echo '⚠️ 访问失败，等待重试...'
                  sleep 5
                  attempt=$((attempt + 1))
              fi
          done
          
          if [ $attempt -gt $max_attempts ]; then
              echo '❌ 健康检查失败'
              exit 1
          fi
          
          # 检查域名访问
          if curl -f -s --max-time 10 \"http://$SERVER_DOMAIN/\" > /dev/null; then
              echo '✅ 域名访问正常'
          else
              echo '❌ 域名访问失败'
              exit 1
          fi

      - name: 📧 发送部署通知邮件
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_HOST_PASSWORD }}
          subject: |
            🔄 服务重启通知 - ${{ github.repository }}
            (提交: ${{ github.sha }})
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          html_body: |
            <h2>🔄 服务重启通知</h2>
            
            <h3>📋 部署信息</h3>
            <ul>
              <li><strong>仓库:</strong> ${{ github.repository }}</li>
              <li><strong>分支:</strong> ${{ github.ref_name }}</li>
              <li><strong>提交:</strong> ${{ github.sha }}</li>
              <li><strong>提交者:</strong> ${{ github.actor }}</li>
              <li><strong>提交信息:</strong> ${{ github.event.head_commit.message }}</li>
              <li><strong>部署时间:</strong> ${{ github.event.head_commit.timestamp }}</li>
            </ul>
            
            <h3>🌐 访问地址</h3>
            <ul>
              <li><strong>IP访问:</strong> <a href="http://${{ env.SERVER_HOST }}">http://${{ env.SERVER_HOST }}</a></li>
              <li><strong>域名访问:</strong> <a href="http://${{ env.SERVER_DOMAIN }}">http://${{ env.SERVER_DOMAIN }}</a></li>
            </ul>
            
            <h3>📊 部署状态</h3>
            ${{ job.status == 'success' && '<p style="color: green;">✅ <strong>重启成功</strong></p>' || '<p style="color: red;">❌ <strong>重启失败</strong></p>' }}
            
            <h3>👤 管理员账号</h3>
            <ul>
              <li><strong>用户名:</strong> admin</li>
              <li><strong>密码:</strong> admin123</li>
            </ul>
            
            <hr>
            <p><small>此邮件由GitHub Actions自动发送</small></p>

      - name: 📊 部署状态总结
        if: always()
        run: |
          if [ \"${{ job.status }}\" == \"success\" ]; then
              echo \"🎉 服务重启成功！\"
              echo \"🌐 访问地址:\"
              echo \"  • http://$SERVER_HOST\"
              echo \"  • http://$SERVER_DOMAIN\"
              echo \"👤 管理员账号: admin / admin123\"
              echo \"📧 通知邮件已发送\"
          else
              echo \"❌ 服务重启失败！\"
              echo \"请检查日志并重试\"
              echo \"📧 失败通知邮件已发送\"
          fi
