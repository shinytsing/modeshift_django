name: QA shift-left gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: API contracts and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            qa/requirements.txt

      - name: Set up Node for Allure rendering
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install application and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r qa/requirements.txt

      - name: Install Playwright Chromium
        # ubuntu-latest already supplies browser system libraries. Playwright 1.40's
        # --with-deps helper asks Ubuntu 24.04 for the retired libasound2 package.
        run: python -m playwright install chromium

      - name: Check formatting for changed Python files
        shell: bash
        run: |
          base_sha="${{ github.event.before }}"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="${{ github.sha }}^"
          fi
          changed_python_files=$(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.py')
          if [ -z "$changed_python_files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          printf '%s\n' "$changed_python_files" | xargs python -m black --check

      - name: Run the shared local and CI QA command
        run: python qa/scripts/run_suite.py

      - name: Summarize QA result
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "qa/artifacts/junit.xml"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## QA shift-left gate\\n")
              if not os.path.exists(report):
                  summary.write("- JUnit was not produced because the test command did not start or complete.\\n")
              else:
                  root = ET.parse(report).getroot()
                  suite = root if root.tag == "testsuite" else root.find("testsuite")
                  tests = suite.attrib.get("tests", "0") if suite is not None else "0"
                  failures = suite.attrib.get("failures", "0") if suite is not None else "0"
                  errors = suite.attrib.get("errors", "0") if suite is not None else "0"
                  summary.write(f"- Tests: {tests}\\n- Failures: {failures}\\n- Errors: {errors}\\n")
              summary.write("- Evidence: download the `qa-evidence` workflow artifact.\\n")
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 14
