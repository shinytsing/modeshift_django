name: 🚀 终极部署工作流

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 部署到服务器
  deploy:
    name: 🚀 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: ⬇️ 检出代码
      uses: actions/checkout@v4
      
    - name: 🚀 智能部署
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        WEB_URL: ${{ secrets.WEB_URL }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "🚀 开始智能部署..."
        
        # 环境变量检查
        if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
          echo "❌ 缺少必要的GitHub Secrets配置"
          echo "请确保设置了以下Secrets:"
          echo "- SERVER_HOST: 47.103.143.152"
          echo "- SERVER_USER: root"
          echo "- SERVER_SSH_KEY: SSH私钥"
          echo "- DEPLOY_PATH: /root/modeshift_django"
          echo "- WEB_URL: https://shenyinqing.xin"
          echo "- API_URL: https://shenyinqing.xin"
          exit 1
        fi
        
        echo "✅ 环境变量检查通过"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        echo "🔗 测试SSH连接..."
        # 多次重试SSH连接
        for i in {1..3}; do
          echo "SSH连接尝试 $i/3..."
          if ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 $USERNAME@$HOST "echo 'SSH连接成功'"; then
            echo "✅ SSH连接成功"
            break
          else
            echo "⚠️ SSH连接失败，重试中..."
            if [ $i -eq 3 ]; then
              echo "❌ SSH连接失败，退出"
              exit 1
            fi
            sleep 5
          fi
        done
        
        # 智能部署 - 分步骤执行避免SSH超时
        echo "🚀 开始智能部署..."
        
        # 步骤1: 检查网络和更新代码
        echo "📥 步骤1: 检查网络和更新代码..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '🔍 检查网络连接...' &&
          if ! ping -c 1 8.8.8.8 > /dev/null 2>&1; then
            echo '❌ 基本网络连接失败'
            exit 1
          fi &&
          echo '📥 智能代码更新...' &&
          if curl -I --connect-timeout 10 https://github.com > /dev/null 2>&1; then
            echo '✅ GitHub连接正常，拉取最新代码' &&
            git config --global http.sslVerify false &&
            git config --global http.postBuffer 524288000 &&
            git config --global http.lowSpeedLimit 1000 &&
            git config --global http.lowSpeedTime 300 &&
            git pull origin main || echo '⚠️ Git拉取失败，使用本地代码'
          else
            echo '⚠️ GitHub连接失败，使用本地代码'
          fi
        " || {
          echo "❌ 步骤1失败"
          exit 1
        }
        
        # 步骤2: 停止现有服务
        echo "🛑 步骤2: 停止现有服务..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '检查现有gunicorn进程...' &&
          if pgrep -f gunicorn > /dev/null; then
            echo '发现gunicorn进程，正在停止...' &&
            pkill -TERM -f gunicorn &&
            sleep 5 &&
            if pgrep -f gunicorn > /dev/null; then
              echo '强制停止gunicorn进程...' &&
              pkill -9 -f gunicorn &&
              sleep 2
            fi
          else
            echo '未发现gunicorn进程'
          fi
        " || {
          echo "⚠️ 步骤2警告: 停止服务失败，继续执行"
        }
        
        # 步骤3: 更新虚拟环境
        echo "🐍 步骤3: 更新虚拟环境..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '智能虚拟环境管理...' &&
          echo '检查虚拟环境状态...' &&
          if [ ! -d 'venv' ]; then
            echo '虚拟环境不存在，创建新环境...' &&
            python3 -m venv venv &&
            venv/bin/python -m pip install --upgrade pip --quiet &&
            venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
          else
            echo '虚拟环境存在，检查Django模块...' &&
            if ! venv/bin/python -c 'import django; print(django.get_version())' > /dev/null 2>&1; then
              echo 'Django模块损坏，重新安装依赖...' &&
              venv/bin/python -m pip install --upgrade pip --quiet &&
              venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
            else
              echo 'Django模块正常，检查requirements.txt更新...' &&
              if [ requirements.txt -nt venv/pyvenv.cfg ]; then
                echo 'requirements.txt已更新，重新安装依赖...' &&
                venv/bin/python -m pip install --upgrade pip --quiet &&
                venv/bin/python -m pip install -r requirements.txt --no-cache-dir --quiet
              else
                echo '虚拟环境无需更新'
              fi
            fi
          fi &&
          echo '验证Django安装...' &&
          venv/bin/python -c 'import django; print(\"Django版本:\", django.get_version())' &&
          echo '✅ 虚拟环境检查完成'
        " || {
          echo "❌ 步骤3失败"
          exit 1
        }
        
        # 步骤4: Django操作
        echo "📁 步骤4: Django操作..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo 'Django操作...' &&
          echo '验证Django环境...' &&
          venv/bin/python -c 'import django; print(\"Django版本:\", django.get_version())' &&
          echo '收集静态文件...' &&
          venv/bin/python manage.py collectstatic --noinput --clear &&
          echo '执行数据库迁移...' &&
          venv/bin/python manage.py migrate --noinput &&
          echo '创建超级用户...' &&
          venv/bin/python manage.py shell -c \"
            from django.contrib.auth import get_user_model
            User = get_user_model()
            if not User.objects.filter(username='admin').exists():
                User.objects.create_superuser('admin', 'admin@example.com', 'admin123')
                print('超级用户创建成功: admin/admin123')
            else:
                print('超级用户已存在')
          \" || echo '⚠️ 超级用户创建失败' &&
          echo '✅ Django操作完成'
        " || {
          echo "❌ 步骤4失败"
          exit 1
        }
        
        # 步骤5: 启动服务
        echo "🚀 步骤5: 启动服务..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '启动服务...' &&
          mkdir -p logs &&
          echo '启动gunicorn服务...' &&
          nohup venv/bin/gunicorn \
            --bind 0.0.0.0:8000 \
            --workers 3 \
            --timeout 120 \
            --max-requests 1000 \
            --max-requests-jitter 100 \
            --preload \
            --access-logfile logs/gunicorn_access.log \
            --error-logfile logs/gunicorn_error.log \
            wsgi:application \
            --daemon &&
          echo '⏳ 等待服务启动...' &&
          sleep 15
        " || {
          echo "❌ 步骤5失败"
          exit 1
        }
        
        # 步骤6: 验证服务状态
        echo "🔍 步骤6: 验证服务状态..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          echo '验证服务状态...' &&
          for i in {1..5}; do
            if pgrep -f gunicorn > /dev/null; then
              echo '✅ gunicorn启动成功'
              break
            else
              echo '⏳ 等待gunicorn启动... (尝试 $i/5)'
              sleep 3
              if [ $i -eq 5 ]; then
                echo '❌ gunicorn启动失败'
                echo '查看错误日志:'
                tail -20 logs/gunicorn_error.log || echo '日志文件不存在'
                exit 1
              fi
            fi
          done &&
          echo '🔄 重载nginx...' &&
          sudo nginx -s reload || echo '⚠️ nginx重载失败' &&
          echo '✅ 部署完成'
        " || {
          echo "❌ 步骤6失败"
          exit 1
        }
        
        echo "🎉 部署成功！"

  # 健康检查和测试
  health-check:
    name: 🏥 健康检查和测试
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    timeout-minutes: 5
    
    steps:
    - name: 🏥 健康检查
      env:
        WEB_URL: ${{ secrets.WEB_URL }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "🏥 开始健康检查..."
        
        WEB_URL="$WEB_URL"
        API_URL="$API_URL"
        
        if [ -z "$WEB_URL" ] || [ -z "$API_URL" ]; then
          echo "❌ 缺少URL配置"
          exit 1
        fi
        
        echo "✅ 测试目标: $WEB_URL"
        
        # 等待服务完全启动
        echo "⏳ 等待服务完全启动..."
        sleep 20
        
        # 测试函数
        test_endpoint() {
          local url=$1
          local name=$2
          local timeout=${3:-15}
          local retries=${4:-3}
          
          echo "🔍 测试 $name..."
          for i in $(seq 1 $retries); do
            if curl -f -s --max-time $timeout "$url" > /dev/null; then
              echo "✅ $name 正常 (尝试 $i/$retries)"
              return 0
            else
              echo "⏳ $name 测试失败，重试中... (尝试 $i/$retries)"
              sleep 5
            fi
          done
          echo "❌ $name 失败"
          return 1
        }
        
        # 核心功能测试
        echo "📊 开始核心功能测试..."
        
        # 基础连接测试
        test_endpoint "$WEB_URL/" "首页" 15 3
        test_endpoint "$WEB_URL/health/" "健康检查" 10 3
        
        # 管理后台测试
        test_endpoint "$WEB_URL/admin/" "管理后台" 10 2
        
        # API测试
        test_endpoint "$API_URL/api/" "API根路径" 10 2
        test_endpoint "$API_URL/api/users/" "用户API" 10 2
        test_endpoint "$API_URL/api/tools/" "工具API" 10 2
        
        # 性能测试
        echo "⚡ 性能测试..."
        response_time=$(curl -o /dev/null -s -w '%{time_total}' --max-time 15 "$WEB_URL/")
        echo "📈 响应时间: ${response_time}秒"
        
        # 状态码测试
        status_code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 15 "$WEB_URL/")
        echo "📊 HTTP状态码: $status_code"
        
        if [ "$status_code" = "200" ]; then
          echo "✅ 状态码正常"
        else
          echo "⚠️ 状态码异常: $status_code"
        fi
        
        # SSL测试
        if [[ "$WEB_URL" == https://* ]]; then
          echo "🔒 SSL证书测试..."
          domain_name=$(echo $WEB_URL | sed 's|https://||' | cut -d'/' -f1)
          if echo | openssl s_client -servername $domain_name -connect $domain_name:443 2>/dev/null | openssl x509 -noout -dates 2>/dev/null; then
            echo "✅ SSL证书正常"
          else
            echo "⚠️ SSL证书检测失败"
          fi
        fi
        
        echo "🎉 健康检查完成！"

  # 部署后通知
  notify:
    name: 📢 部署通知
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    
    steps:
    - name: 📢 部署结果通知
      run: |
        echo "📢 部署结果通知"
        echo "================"
        
        if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.health-check.result }}" == "success" ]; then
          echo "✅ 部署成功！"
          echo "🌐 网站地址: ${{ secrets.WEB_URL }}"
          echo "🔌 API地址: ${{ secrets.API_URL }}"
          echo "👤 管理员账号: admin / admin123"
          echo "🎉 所有测试通过，服务正常运行！"
        elif [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "⚠️ 部署成功，但健康检查失败"
          echo "🌐 网站地址: ${{ secrets.WEB_URL }}"
          echo "🔧 请检查服务状态和日志"
        else
          echo "❌ 部署失败！"
          echo "🔍 请检查部署日志和错误信息"
          echo "💡 建议使用手动部署或检查服务器状态"
        fi
        
        echo ""
        echo "📊 各阶段状态:"
        echo "- 服务器部署: ${{ needs.deploy.result }}"
        echo "- 健康检查: ${{ needs.health-check.result }}"
