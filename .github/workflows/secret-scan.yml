name: Secret scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Block committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out commit history for the scan
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan newly pushed commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
