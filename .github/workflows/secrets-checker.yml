name: Secrets Configuration Checker

# 独立的secrets检查工作流
on:
  workflow_dispatch:
    inputs:
      check_type:
        description: '检查类型'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - deployment
        - emergency
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-check:
    name: Secrets配置检查
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 全面Secrets检查
      run: |
        echo "🔍 开始全面Secrets配置检查..."
        echo "=========================================="
        echo "检查时间: $(date)"
        echo "检查类型: ${{ github.event.inputs.check_type || 'all' }}"
        echo ""
        
        # 初始化检查结果
        missing_secrets=""
        total_checks=0
        passed_checks=0
        
        # 定义需要检查的secrets
        declare -A secrets_info=(
          ["SERVER_HOST"]="服务器IP地址或域名"
          ["SERVER_USER"]="SSH用户名"
          ["SERVER_SSH_KEY"]="SSH私钥内容"
          ["SERVER_PORT"]="SSH端口（可选）"
        )
        
        # 检查 SERVER_HOST
        total_checks=$((total_checks + 1))
        echo "📋 检查 SERVER_HOST..."
        echo "   说明: 服务器IP地址或域名"
        if [ -z "${{ secrets.SERVER_HOST }}" ]; then
          echo "   ❌ SERVER_HOST 未配置"
          missing_secrets="$missing_secrets SERVER_HOST"
        else
          echo "   ✅ SERVER_HOST 已配置"
          echo "   值: ${{ secrets.SERVER_HOST }}"
          passed_checks=$((passed_checks + 1))
        fi
        echo ""
        
        # 检查 SERVER_USER
        total_checks=$((total_checks + 1))
        echo "📋 检查 SERVER_USER..."
        echo "   说明: SSH用户名"
        if [ -z "${{ secrets.SERVER_USER }}" ]; then
          echo "   ❌ SERVER_USER 未配置"
          missing_secrets="$missing_secrets SERVER_USER"
        else
          echo "   ✅ SERVER_USER 已配置"
          echo "   值: ${{ secrets.SERVER_USER }}"
          passed_checks=$((passed_checks + 1))
        fi
        echo ""
        
        # 检查 SERVER_SSH_KEY
        total_checks=$((total_checks + 1))
        echo "📋 检查 SERVER_SSH_KEY..."
        echo "   说明: SSH私钥内容"
        if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
          echo "   ❌ SERVER_SSH_KEY 未配置"
          missing_secrets="$missing_secrets SERVER_SSH_KEY"
        else
          echo "   ✅ SERVER_SSH_KEY 已配置"
          ssh_key_length=$(echo '${{ secrets.SERVER_SSH_KEY }}' | wc -c)
          ssh_key_preview=$(echo '${{ secrets.SERVER_SSH_KEY }}' | head -c 30)
          echo "   长度: $ssh_key_length 字符"
          echo "   格式: $ssh_key_preview..."
          passed_checks=$((passed_checks + 1))
        fi
        echo ""
        
        # 检查 SERVER_PORT
        total_checks=$((total_checks + 1))
        echo "📋 检查 SERVER_PORT..."
        echo "   说明: SSH端口（可选）"
        if [ -z "${{ secrets.SERVER_PORT }}" ]; then
          echo "   ⚠️ SERVER_PORT 未配置，将使用默认值 22"
          passed_checks=$((passed_checks + 1))
        else
          echo "   ✅ SERVER_PORT 已配置"
          echo "   值: ${{ secrets.SERVER_PORT }}"
          passed_checks=$((passed_checks + 1))
        fi
        echo ""
        
        echo "=========================================="
        echo "📊 检查结果汇总:"
        echo "总检查项: $total_checks"
        echo "通过检查: $passed_checks"
        echo "失败检查: $((total_checks - passed_checks))"
        
        if [ $passed_checks -eq $total_checks ]; then
          echo "✅ 所有必需的secrets都已正确配置！"
          echo "🚀 可以正常进行部署操作"
        else
          echo "❌ 发现 $((total_checks - passed_checks)) 个配置问题"
          echo "缺少的secrets: $missing_secrets"
          echo ""
          echo "📋 配置指南:"
          echo "1. 进入仓库 Settings → Secrets and variables → Actions"
          echo "2. 点击 'New repository secret'"
          echo "3. 添加缺少的secrets："
          echo ""
          if [[ "$missing_secrets" == *"SERVER_HOST"* ]]; then
            echo "• SERVER_HOST: 服务器IP地址或域名"
          fi
          if [[ "$missing_secrets" == *"SERVER_USER"* ]]; then
            echo "• SERVER_USER: SSH用户名"
          fi
          if [[ "$missing_secrets" == *"SERVER_SSH_KEY"* ]]; then
            echo "• SERVER_SSH_KEY: SSH私钥内容"
          fi
          if [[ "$missing_secrets" == *"SERVER_PORT"* ]]; then
            echo "• SERVER_PORT: SSH端口（可选）"
          fi
        fi
        
        echo "=========================================="
        
        # 设置输出
        if [ $passed_checks -eq $total_checks ]; then
          echo "secrets_status=complete" >> $GITHUB_OUTPUT
          echo "missing_count=0" >> $GITHUB_OUTPUT
        else
          echo "secrets_status=incomplete" >> $GITHUB_OUTPUT
          echo "missing_count=$((total_checks - passed_checks))" >> $GITHUB_OUTPUT
        fi
        echo "missing_secrets=$missing_secrets" >> $GITHUB_OUTPUT
      id: secrets_check
    
    - name: 配置建议
      if: steps.secrets_check.outputs.secrets_status == 'incomplete'
      run: |
        echo "💡 配置建议和示例:"
        echo "=========================================="
        echo ""
        echo "🔧 SERVER_HOST 配置示例:"
        echo "• IP地址: 47.103.143.152"
        echo "• 域名: your-server.com"
        echo "• 本地测试: localhost"
        echo ""
        echo "🔧 SERVER_USER 配置示例:"
        echo "• Linux服务器: root, ubuntu, admin"
        echo "• 云服务器: ec2-user, azureuser"
        echo "• 自定义用户: your-username"
        echo ""
        echo "🔧 SERVER_SSH_KEY 配置示例:"
        echo "• 生成SSH密钥: ssh-keygen -t rsa -b 4096"
        echo "• 复制私钥内容（包括BEGIN和END行）"
        echo "• 确保密钥有正确的权限: chmod 600 ~/.ssh/id_rsa"
        echo ""
        echo "🔧 SERVER_PORT 配置示例:"
        echo "• 默认SSH端口: 22"
        echo "• 自定义端口: 2222, 2200, 22000"
        echo "• 云服务器端口: 检查安全组设置"
        echo ""
        echo "📝 配置完成后，重新运行此检查工作流"
        echo "=========================================="
    
    - name: 部署准备检查
      if: steps.secrets_check.outputs.secrets_status == 'complete'
      run: |
        echo "🎉 Secrets配置完整！"
        echo "=========================================="
        echo "✅ 所有必需的secrets都已正确配置"
        echo "🚀 现在可以进行以下操作："
        echo ""
        echo "1. 正常CI/CD部署:"
        echo "   • 推送代码到main分支"
        echo "   • 或手动触发 'ModeShift Django CI/CD Pipeline'"
        echo ""
        echo "2. 紧急部署:"
        echo "   • 手动触发 'ModeShift Django CI/CD Pipeline'"
        echo "   • 选择 'emergency-deploy' 类型"
        echo ""
        echo "3. 验证部署:"
        echo "   • 检查服务器连接: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
        echo "   • 验证服务状态: curl http://${{ secrets.SERVER_HOST }}:8000/health/"
        echo ""
        echo "📊 当前配置摘要:"
        echo "• 服务器: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PORT || 22 }}"
        ssh_key_length=$(echo '${{ secrets.SERVER_SSH_KEY }}' | wc -c)
        echo "• SSH密钥: 已配置 ($ssh_key_length 字符)"
        echo "=========================================="
