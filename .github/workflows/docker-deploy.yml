name: 🐳 Docker一键部署 + 智能检测

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-deploy:
    name: 🐳 Docker智能部署
    runs-on: ubuntu-latest
    timeout-minutes: 6
    
    steps:
    - name: ⬇️ 检出代码
      uses: actions/checkout@v4
    
    - name: 🐳 Docker一键部署
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        WEB_URL: ${{ secrets.WEB_URL }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "🐳 开始Docker一键部署..."
        
        # 检查环境变量
        if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
          echo "❌ 缺少必要的GitHub Secrets配置"
          exit 1
        fi
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        # 测试SSH连接
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $USERNAME@$HOST "echo 'SSH连接成功'" || {
          echo "❌ SSH连接失败"
          exit 1
        }
        
        echo "✅ SSH连接正常"
        
        # Docker一键部署
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 $USERNAME@$HOST "
          cd $DEPLOY_PATH &&
          
          echo '📥 拉取最新代码...' &&
          git config --global http.sslVerify false &&
          git pull origin main &&
          
          echo '🐳 Docker智能部署...' &&
          # 停止旧容器
          docker-compose down || true &&
          
          # 构建新镜像
          docker-compose build --no-cache &&
          
          # 启动服务
          docker-compose up -d &&
          
          # 等待服务启动
          sleep 10 &&
          
          # 健康检查
          docker-compose ps &&
          
          echo '✅ Docker部署完成'
        "
        
        echo "🎉 Docker一键部署成功！"

  smart-health-check:
    name: 🧠 智能健康检测
    runs-on: ubuntu-latest
    needs: docker-deploy
    timeout-minutes: 2
    
    steps:
    - name: 🧠 智能健康检测
      env:
        WEB_URL: ${{ secrets.WEB_URL }}
        API_URL: ${{ secrets.API_URL }}
      run: |
        echo "🧠 开始智能健康检测..."
        
        WEB_URL="$WEB_URL"
        API_URL="$API_URL"
        
        if [ -z "$WEB_URL" ] || [ -z "$API_URL" ]; then
          echo "❌ 缺少URL配置"
          exit 1
        fi
        
        echo "✅ 检测目标: $WEB_URL"
        
        # 等待服务启动
        echo "⏳ 等待服务启动..."
        sleep 10
        
        # 智能检测函数
        smart_check() {
          local url=$1
          local name=$2
          local timeout=${3:-8}
          
          echo "🔍 检测 $name..."
          
          # 多次重试
          for i in {1..3}; do
            if curl -f -s --max-time $timeout "$url" > /dev/null; then
              echo "✅ $name 正常 (尝试 $i/3)"
              return 0
            else
              echo "⚠️ $name 异常 (尝试 $i/3)"
              sleep 2
            fi
          done
          
          echo "❌ $name 最终失败"
          return 1
        }
        
        # 核心功能检测
        echo "📊 开始核心功能检测..."
        
        smart_check "$WEB_URL/" "首页" 8
        smart_check "$WEB_URL/admin/" "管理后台" 8
        smart_check "$WEB_URL/static/" "静态文件" 8
        
        # API检测
        smart_check "$API_URL/api/" "API根路径" 8
        smart_check "$API_URL/health/" "健康检查" 8
        smart_check "$API_URL/api/users/" "用户API" 8
        smart_check "$API_URL/api/tools/" "工具API" 8
        
        # 性能分析
        echo "⚡ 性能分析..."
        response_time=$(curl -o /dev/null -s -w '%{time_total}' --max-time 8 "$WEB_URL/")
        echo "📈 响应时间: ${response_time}秒"
        
        # 状态码检测
        echo "🔍 状态码检测..."
        status_code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 8 "$WEB_URL/")
        echo "📊 HTTP状态码: $status_code"
        
        if [ "$status_code" = "200" ]; then
          echo "✅ 状态码正常"
        else
          echo "⚠️ 状态码异常: $status_code"
        fi
        
        echo "🎉 智能健康检测完成！"
        echo "🌐 网站地址: $WEB_URL"
        echo "🔌 API地址: $API_URL"

  deployment-summary:
    name: 📋 部署总结
    runs-on: ubuntu-latest
    needs: [docker-deploy, smart-health-check]
    if: always()
    
    steps:
    - name: 📋 生成部署总结
      run: |
        echo "📋 部署总结报告"
        echo "=================="
        echo "🐳 Docker部署: ${{ needs.docker-deploy.result }}"
        echo "🧠 健康检测: ${{ needs.smart-health-check.result }}"
        echo "⏰ 部署时间: $(date)"
        echo "🌐 网站地址: ${{ secrets.WEB_URL }}"
        echo "🔌 API地址: ${{ secrets.API_URL }}"
        
        if [ "${{ needs.docker-deploy.result }}" == "success" ] && [ "${{ needs.smart-health-check.result }}" == "success" ]; then
          echo "🎉 部署完全成功！"
          echo "✅ 所有检测通过"
        else
          echo "❌ 部署存在问题"
          echo "🔍 请检查详细日志"
        fi
