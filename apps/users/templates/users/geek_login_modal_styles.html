<style>
/* 极客风格登录弹窗样式 */
.geek-login-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
  overflow: hidden;
  /* 优化字体渲染 */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* 矩阵风格背景 */
.matrix-background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  opacity: 0.1;
}

#matrixCanvas {
  width: 100%;
  height: 100%;
}

/* 粒子效果背景 */
.particles-background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  opacity: 0.3;
}

#particlesCanvas {
  width: 100%;
  height: 100%;
}

.modal-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(15px);
  z-index: 3;
}

.geek-modal-container {
  position: relative;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0a0a0a 100%);
  border-radius: 15px;
  box-shadow: 
    0 0 50px rgba(0, 255, 255, 0.3),
    0 0 100px rgba(0, 255, 255, 0.1),
    inset 0 0 50px rgba(0, 255, 255, 0.05);
  width: 700px;
  max-width: 90vw;
  max-height: 85vh;
  overflow: hidden;
  border: 2px solid rgba(0, 255, 255, 0.3);
  z-index: 4;
  animation: geekSlideIn 0.5s ease-out;
  margin: auto;
  /* 确保完美居中 */
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

@keyframes geekSlideIn {
  from {
    opacity: 0;
    transform: scale(0.8) translateY(-50px);
    filter: blur(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
    filter: blur(0);
  }
}

/* 终端风格标题栏 */
.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 20px;
  background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
  border-bottom: 2px solid rgba(0, 255, 255, 0.3);
  position: relative;
}

.terminal-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.8), transparent);
  animation: scanLine 2s linear infinite;
}

@keyframes scanLine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.terminal-controls {
  display: flex;
  gap: 8px;
}

.control-btn {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s ease;
}

.close-btn {
  background: #ff5f57;
  box-shadow: 0 0 10px rgba(255, 95, 87, 0.5);
}

.minimize-btn {
  background: #ffbd2e;
  box-shadow: 0 0 10px rgba(255, 189, 46, 0.5);
}

.maximize-btn {
  background: #28ca42;
  box-shadow: 0 0 10px rgba(40, 202, 66, 0.5);
}

.control-btn:hover {
  transform: scale(1.2);
  box-shadow: 0 0 20px currentColor;
}

.terminal-title {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #00ffff;
  font-size: 14px;
  font-weight: bold;
}

.terminal-icon {
  font-size: 16px;
  animation: pulse 2s infinite;
}

.terminal-text {
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
  font-weight: 600;
  /* 优化字体渲染 */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.terminal-status {
  color: #00ff00;
  font-size: 12px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.3; }
}

/* 终端内容区域 */
.terminal-content {
  padding: 25px;
  color: #00ff00;
  font-size: 16px;

  overflow-y: auto;
  font-family: 'Courier New', 'Monaco', 'Menlo', monospace;

}

.terminal-content::-webkit-scrollbar {

}

.terminal-content::-webkit-scrollbar-track {

}

}

/* ASCII艺术Logo */
.ascii-logo {
  text-align: center;
  margin-bottom: 30px;
}

.ascii-art {
  color: #00ffff;

@keyframes glow {
  from { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }

}

.logo-subtitle {

  margin-top: 10px;
}

.geek-tagline {
  color: #ff00ff;
  font-size: 14px;

}

.version-info {

}

/* 命令行提示符 */
.command-prompt {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 20px;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
  /* 优化字体渲染 */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

}

/* 终端消息 */
.terminal-messages {

  overflow-y: auto;
}

/* 错误动画样式 */
.error-animation {
  animation: errorBlink 0.5s ease-in-out 3;
}

.error-prefix {
  color: #ff0000 !important;
  text-shadow: 0 0 10px #ff0000;
}

.error-text {
  color: #ff6666 !important;
  text-shadow: 0 0 5px #ff0000;
}

/* 错误闪烁动画 */
@keyframes errorBlink {
  0%, 100% { 
    opacity: 1; 
    transform: scale(1);
  }
  50% { 
    opacity: 0.3; 
    transform: scale(1.05);
  }
}

/* 震动动画 */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

/* 边框闪烁动画 */
@keyframes borderFlash {
  0%, 100% { 
    border-color: #ff0000;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
  }
  50% { 
    border-color: #ff6666;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
  }
}

.message-line {

  font-family: 'Courier New', monospace;
}

.message-prefix {

  font-size: 14px;
}

.message-text {
  color: #00ff00;
  font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
  font-size: 14px;
  font-weight: 500;
}

.auth-tabs {

}

.auth-tab {

  align-items: center;
  justify-content: center;

}

.auth-tab.active {

.tab-icon {

}

.tab-shortcut {

}

/* 表单样式 */
.geek-form {
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 20px;
}

.input-label {
  display: flex;
  align-items: center;

  margin-bottom: 8px;
  font-family: 'Courier New', monospace;
}

.label-icon {
  font-size: 14px;
}

.label-text {
  color: #00ffff;
  font-weight: bold;

  font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
  letter-spacing: 0.5px;
}

.geek-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-prefix {
  color: #00ff00;
  font-weight: bold;
  margin-right: 8px;
  font-family: 'Courier New', monospace;
}

.geek-input {
  flex: 1;
  background: rgba(0, 0, 0, 0.7);
  border: 2px solid rgba(0, 255, 255, 0.4);
  border-radius: 6px;
  color: #00ff00;
  font-size: 16px;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
  font-weight: 500;
  padding: 14px 18px;
  transition: all 0.3s ease;
  outline: none;
  /* 优化字体渲染 */
  -webkit-font-smoothing: antialiased;

}

.geek-input::placeholder {
  color: rgba(0, 255, 0, 0.7);
  font-weight: 400;
}

.geek-input:focus {
  border-color: #00ffff;
  background: rgba(0, 0, 0, 0.7);

  text-shadow: 0 0 5px rgba(0, 255, 0, 0.8);
}

.input-glow {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, #00ffff, #00ff00);
  transition: width 0.3s ease;
}

.geek-input:focus + .input-glow {
  width: 100%;
}

/* 按钮样式 */
.geek-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 24px;
  background: linear-gradient(135deg, #00ffff 0%, #0099cc 100%);
  border: 2px solid rgba(0, 255, 255, 0.6);
  border-radius: 8px;
  color: #000000;
  font-size: 16px;
  font-weight: bold;
  font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  /* 优化字体渲染 */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  margin-bottom: 15px;
  width: 100%;
  letter-spacing: 0.5px;
}

.geek-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s ease;
}

.geek-btn:hover::before {
  left: 100%;
}

.geek-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0, 255, 255, 0.4);
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
}

.geek-btn:active {
  transform: translateY(0);
}

.geek-btn.primary {
  background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
  border-color: rgba(0, 255, 0, 0.5);
}

.geek-btn.primary:hover {
  box-shadow: 0 10px 25px rgba(0, 255, 0, 0.4);
}

.geek-btn.social {
  background: linear-gradient(135deg, #ff00ff 0%, #cc00cc 100%);
  border-color: rgba(255, 0, 255, 0.5);
}

.geek-btn.social:hover {
  box-shadow: 0 10px 25px rgba(255, 0, 255, 0.4);
}

/* OAuth分隔符 */
.oauth-divider {
  display: flex;
  align-items: center;
  margin: 20px 0;
  text-align: center;
}

.oauth-divider::before,
.oauth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
}

.divider-text {
  padding: 0 15px;
  color: #00ffff;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: bold;
  text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
}

/* Google OAuth按钮 */
.geek-btn.google-oauth {
  background: linear-gradient(135deg, #4285f4 0%, #1a73e8 100%);
  border-color: rgba(66, 133, 244, 0.5);
  margin-top: 10px;
}

.geek-btn.google-oauth:hover {
  box-shadow: 0 10px 25px rgba(66, 133, 244, 0.4);
  background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
}

.geek-btn.google-oauth .btn-icon {
  color: #ffffff;
}


.btn-icon {
  font-size: 16px;
}

.btn-text {
  font-weight: bold;
  font-size: 16px;
}

.btn-shortcut {
  font-size: 12px;
  opacity: 0.8;
  font-weight: 500;
}

/* 社交登录区域 */
.social-login-section {
  margin-top: 25px;
}

.divider {
  text-align: center;
  margin: 25px 0;
  position: relative;
}

.divider::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
}

.divider-text {
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);

  color: #ffff00;
  font-size: 14px;
  font-weight: bold;
  font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
  position: relative;
  z-index: 1;
  letter-spacing: 1px;
}

/* 密码强度指示器 */
.password-strength {
  margin-top: 10px;
  transition: all 0.3s ease;
}

.strength-bar {
  width: 100%;
  height: 6px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
  border: 1px solid rgba(0, 255, 255, 0.2);
}

.strength-fill {
  height: 100%;
  width: 0%;
  transition: all 0.3s ease;
  border-radius: 3px;
}

.strength-text {
  font-size: 13px;
  color: rgba(0, 255, 255, 0.9);
  text-align: center;
  font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
  font-weight: bold;
  letter-spacing: 0.5px;
}

/* 密码强度等级颜色 */
.password-strength.weak .strength-fill {
  background: linear-gradient(90deg, #ff0000, #ff4444);
  width: 25%;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
}

.password-strength.fair .strength-fill {
  background: linear-gradient(90deg, #ff8800, #ffaa44);
  width: 50%;
  box-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
}

.password-strength.good .strength-fill {
  background: linear-gradient(90deg, #ffff00, #ffff44);
  width: 75%;
  box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
}

.password-strength.strong .strength-fill {
  background: linear-gradient(90deg, #00ff00, #44ff44);
  width: 100%;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}

.password-strength.weak .strength-text {
  color: #ff0000;
}

.password-strength.fair .strength-text {
  color: #ff8800;
}

.password-strength.good .strength-text {
  color: #ffff00;
}

.password-strength.strong .strength-text {
  color: #00ff00;
}

.legal-notice {

}

.legal-text {

.legal-content {

    padding: 20px;

  }

    flex-direction: column;
    gap: 10px;
  }
  
  .status-item {
    justify-content: center;
  }

    padding: 12px 16px;
    font-size: 12px;
  }
  
  .btn-icon {
    font-size: 14px;
  }
  
  .btn-text {
    font-size: 12px;
  }
