<!-- 现代化登录弹窗 -->
<div id="loginModal" class="modern-login-modal" style="display: none;">
  <div class="modal-backdrop" onclick="closeLoginModal()"></div>
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-logo">
        <div class="logo-icon">
          <i class="fas fa-code"></i>
        </div>
        <div class="logo-text">
          <span class="brand-name">ModeShift</span>
          <span class="brand-tagline">极客工坊</span>
        </div>
      </div>
      <button class="modal-close" onclick="closeLoginModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-content">
      <!-- 消息显示区域 -->
      {% if messages %}
        <div class="message-container">
          {% for message in messages %}
            <div class="message message-{{ message.tags }}">
              <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
      
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">
          <i class="fas fa-sign-in-alt"></i>
          <span>登录</span>
        </button>
        <button class="auth-tab" data-tab="register">
          <i class="fas fa-user-plus"></i>
          <span>注册</span>
        </button>
      </div>
      
      <!-- 登录表单 -->
      <div class="auth-form-container" id="loginForm">
        <form method="POST" class="auth-form" id="loginFormElement">
          {% csrf_token %}
          <input type="hidden" name="form_type" value="login">
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" name="username" class="form-input" placeholder="用户名" required>
              <div class="input-line"></div>
            </div>
          </div>
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" name="password" class="form-input" placeholder="密码" required>
              <div class="input-line"></div>
            </div>
          </div>
          
          
          <button type="submit" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i>
            <span>登录</span>
          </button>
        </form>
      </div>
      
      <!-- 注册表单 -->
      <div class="auth-form-container" id="registerForm" style="display: none;">
        <form method="POST" class="auth-form" id="registerFormElement">
          {% csrf_token %}
          <input type="hidden" name="form_type" value="register">
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" name="username" class="form-input" placeholder="用户名" required>
              <div class="input-line"></div>
            </div>
          </div>
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" name="password" class="form-input" placeholder="密码" required id="registerPasswordInput">
              <div class="input-line"></div>
            </div>
            <!-- 密码强度指示器 -->
            <div class="password-strength" id="registerPasswordStrength" style="display: none;">
              <div class="strength-bar">
                <div class="strength-fill" id="registerStrengthFill"></div>
              </div>
              <div class="strength-text" id="registerStrengthText">密码强度</div>
            </div>
          </div>
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" name="password_confirm" class="form-input" placeholder="确认密码" required>
              <div class="input-line"></div>
            </div>
          </div>
          
          <div class="form-group">
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" name="email" class="form-input email-input" placeholder="邮箱（可选）">
              <div class="input-line"></div>
            </div>
          </div>
          
          <button type="submit" class="btn-primary">
            <i class="fas fa-user-plus"></i>
            <span>注册</span>
          </button>
        </form>
      </div>
      
      <!-- 一键登录区域 -->
      <div class="social-login-section">
        <div class="divider">
          <span>一键注册</span>
        </div>
        
        <div class="social-buttons">
          <button class="social-btn google-btn" onclick="initiateGoogleAuth()" title="Google 登录">
            <div class="social-icon">
              <svg viewBox="0 0 24 24" width="32" height="32">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
            </div>
            <span>Google 登录</span>
          </button>
        </div>
      </div>
      
      <!-- 服务条款和隐私政策 -->
      <div class="legal-notice">
        <p>
          继续使用即表示您同意我们的
          <a href="#" onclick="showTermsOfService()" class="legal-link">服务条款</a>
          和
          <a href="#" onclick="showPrivacyPolicy()" class="legal-link">隐私政策</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div id="termsModal" class="legal-modal" style="display: none;">
  <div class="modal-backdrop" onclick="closeTermsModal()"></div>
  <div class="modal-container legal-container">
    <div class="modal-header">
      <h3>服务条款</h3>
      <button class="modal-close" onclick="closeTermsModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-content legal-content">
      <div id="termsContent">
        <!-- 服务条款内容将通过JavaScript加载 -->
      </div>
    </div>
  </div>
</div>

<div id="privacyModal" class="legal-modal" style="display: none;">
  <div class="modal-backdrop" onclick="closePrivacyModal()"></div>
  <div class="modal-container legal-container">
    <div class="modal-header">
      <h3>隐私政策</h3>
      <button class="modal-close" onclick="closePrivacyModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-content legal-content">
      <div id="privacyContent">

      </div>
    </div>
  </div>
</div>

<script>
// 密码强度检测函数
function checkPasswordStrength(password) {
    let score = 0;
    let feedback = [];
    
    // 检查常见弱密码
    const weakPasswords = [
        "password", "123456", "qwerty", "admin", "12345678", "password123",
        "123456789", "1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm",
        "111111", "000000", "123123", "abc123", "password1", "admin123",
        "root", "user", "guest", "test", "demo", "sample", "default",
        "1234", "12345", "1234567", "123456789", "987654321", "654321",
        "qwerty123", "asdf1234", "zxcv1234", "iloveyou", "welcome",
        "monkey", "dragon", "master", "hello", "letmein", "princess",
        "qazwsx", "michael", "jordan", "harley", "ranger", "shadow",
        "sunshine", "superman", "qwertyui", "trustno1", "batman"
    ];
    
    if (weakPasswords.includes(password.toLowerCase())) {
        return {
            strength: 'weak',
            strengthText: '弱',
            score: 0,
            feedback: ['密码过于简单，请选择更复杂的密码']
        };
    }
    
    // 长度检查
    if (password.length >= 8) {
        score += 1;
    } else {
        feedback.push('至少8个字符');
    }
    
    // 包含小写字母
    if (/[a-z]/.test(password)) {
        score += 1;
    } else {
        feedback.push('包含小写字母');
    }
    
    // 包含大写字母
    if (/[A-Z]/.test(password)) {
        score += 1;
    } else {
        feedback.push('包含大写字母');
    }
    
    // 包含数字
    if (/\d/.test(password)) {
        score += 1;
    } else {
        feedback.push('包含数字');
    }
    
    // 包含特殊字符
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        score += 1;
    } else {
        feedback.push('包含特殊字符');
    }
    
    // 检查连续重复字符
    if (/(.)\1{2,}/.test(password)) {
        score -= 1;
        feedback.push('避免连续重复字符');
    }
    
    // 检查连续数字或字母
    if (/123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz/i.test(password)) {
        score -= 1;
        feedback.push('避免连续字符');
    }
    
    // 检查键盘模式
    const keyboardPatterns = [
        'qwerty', 'asdfgh', 'zxcvbn', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm',
        'qazwsx', 'wsxedc', 'edcrfv', 'rfvtgb', 'tgbyhn', 'yhnujm'
    ];
    
    for (let pattern of keyboardPatterns) {
        if (password.toLowerCase().includes(pattern)) {
            score -= 1;
            feedback.push('避免键盘模式');
            break;
        }
    }
    
    // 确保分数不为负数
    score = Math.max(0, score);
    
    // 根据分数确定强度等级
    let strength = '';
    let strengthText = '';
    
    if (score <= 1) {
        strength = 'weak';
        strengthText = '弱';
    } else if (score <= 2) {
        strength = 'fair';
        strengthText = '一般';
    } else if (score <= 3) {
        strength = 'good';
        strengthText = '良好';
    } else {
        strength = 'strong';
        strengthText = '强';
    }
    
    return {
        strength: strength,
        strengthText: strengthText,
        score: score,
        feedback: feedback
    };
}

// 更新密码强度显示
function updatePasswordStrength(inputId, strengthId, fillId, textId) {
    const passwordInput = document.getElementById(inputId);
    const strengthDiv = document.getElementById(strengthId);
    const strengthFill = document.getElementById(fillId);
    const strengthText = document.getElementById(textId);
    
    if (!passwordInput || !strengthDiv) return;
    
    const password = passwordInput.value;
    
    if (password.length === 0) {
        strengthDiv.style.display = 'none';
        return;
    }
    
    strengthDiv.style.display = 'block';
    
    const result = checkPasswordStrength(password);
    
    // 移除所有强度类
    strengthDiv.className = 'password-strength';
    // 添加新的强度类
    strengthDiv.classList.add(result.strength);
    
    // 更新文本
    if (strengthText) {
        strengthText.textContent = `密码强度: ${result.strengthText}`;
    }
}

                'registerPasswordInput',

            );

});
