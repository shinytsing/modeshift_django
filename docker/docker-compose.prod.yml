version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: modeshift_postgres
    environment:
      POSTGRES_DB: qatoolbox_production
      POSTGRES_USER: qatoolbox
      POSTGRES_PASSWORD: qatoolbox123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatoolbox -d qatoolbox_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: modeshift_redis
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Django 应用（context 为项目根目录，请在项目根执行 docker compose -f docker/docker-compose.prod.yml up）
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: modeshift_web
    env_file: ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.docker_production
      - DEBUG=False
      - DB_NAME=qatoolbox_production
      - DB_USER=qatoolbox
      - DB_PASSWORD=qatoolbox123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis123@redis:6379/0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,192.168.27.128,shenyiqing.xyz,www.shenyiqing.xyz
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120
      --max-requests 1000 --max-requests-jitter 100 wsgi:application"
    volumes:
      - ../config/settings/docker_production.py:/app/config/settings/docker_production.py:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: modeshift_nginx
    ports:
      - "80:80"
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  default:
    name: modeshift_network
