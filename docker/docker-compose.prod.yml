services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: modeshift_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-qatoolbox_production}
      POSTGRES_USER: ${DB_USER:-qatoolbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: modeshift_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --raw ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Django 应用（context 为项目根目录，请在项目根执行 docker compose -f docker/docker-compose.prod.yml up）
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    image: &app-image ${QATOOLBOX_IMAGE:?Set QATOOLBOX_IMAGE to the verified release in .env}
    container_name: modeshift_web
    env_file: ../.env
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.docker_production
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-qatoolbox_production}
      DB_USER: ${DB_USER:-qatoolbox}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      WECHAT_MINIPROGRAM_APPID: ${WECHAT_MINIPROGRAM_APPID:-}
      WECHAT_MINIPROGRAM_SECRET: ${WECHAT_MINIPROGRAM_SECRET:-}
      XHS_MCP_BASE_URL: ${XHS_MCP_BASE_URL:-http://127.0.0.1:18060}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,shenyiqing.xyz,www.shenyiqing.xyz}
    command: >-
      sh -c "python manage.py migrate --noinput --run-syncdb &&
      exec daphne -b 0.0.0.0 -p 8000 asgi:application"
    volumes: &app-volumes
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  creator_watch:
    image: *app-image
    env_file: ../.env
    environment: *app-environment
    volumes: *app-volumes
    command: celery -A config worker --beat --pool=solo --concurrency=1 -Q creator_watch --loglevel=INFO
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: modeshift_nginx
    ports:
      - "80:80"
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  default:
    name: modeshift_network
