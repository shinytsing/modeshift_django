[tool:pytest]
# pytest配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5

# 标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    ui: marks tests as UI tests
    websocket: marks tests as WebSocket tests
    performance: marks tests as performance tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests

# 异步测试
asyncio_mode = auto

# 最小版本要求
minversion = 6.0

# 测试目录
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    .venv
    venv
    __pycache__
    .pytest_cache

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:django.*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试报告
junit_family = xunit2
junit_suite_name = modeshift_django_tests
junit_logging = all
junit_log_passing_tests = true

# HTML报告
htmlpath = tests/reports/html-report.html
html = tests/reports/html-report.html

# 覆盖率配置
addopts = --cov=apps --cov-report=html:tests/reports/coverage --cov-report=term-missing --cov-report=xml:tests/reports/coverage.xml

# 性能测试配置
timeout = 300
timeout_method = thread